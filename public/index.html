<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ektib</title>
<meta name="description" content="Learn to read and write Egyptian Arabic with your Apple Pencil.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ektib">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf2fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1323" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one winding path of lesson stops under Cairo street-sign unit plaques; each lesson is a full-screen card whose centrepiece is a writing slate for the Pencil. */
:root{
  --bg:#edf2fa; --surface:#ffffff; --surface-2:#f5f8fd; --ink:#14213d; --muted:#586987; --line:#d2dbea;
  --enamel:#1d4aa0; --enamel-deep:#123672; --on-enamel:#ffffff;
  --mango:#f0a20f; --mango-deep:#bf7d00; --on-mango:#2b1d00;
  --good:#1f9a4b; --good-deep:#157238; --good-tint:#e1f5e7;
  --bad:#d63a41; --bad-deep:#a3242a; --bad-tint:#fde7e7;
  --guide:#c5d3ec; --slate:#fbfcff; --stroke:#14213d; --baseline:#e2a33a;
  --locked:#dde4ef; --locked-deep:#c2ccdb; --locked-ink:#8d9bb3;
  --ui:"Baloo Bhaijaan 2","Geeza Pro",ui-rounded,system-ui,sans-serif;
  --naskh:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1323; --surface:#151f35; --surface-2:#1a2640; --ink:#e8eef9; --muted:#97a7c4; --line:#2a3a5a;
  --enamel:#3d71da; --enamel-deep:#2851a8; --on-enamel:#ffffff;
  --mango:#f4b131; --mango-deep:#c1840f; --on-mango:#2b1d00;
  --good:#3cc26a; --good-deep:#25904b; --good-tint:#12301f;
  --bad:#ff5e64; --bad-deep:#c23b41; --bad-tint:#3a191d;
  --guide:#2f4572; --slate:#10192b; --stroke:#f1f5ff; --baseline:#a57820;
  --locked:#222f4a; --locked-deep:#18223a; --locked-ink:#5f6f8f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1323; --surface:#151f35; --surface-2:#1a2640; --ink:#e8eef9; --muted:#97a7c4; --line:#2a3a5a;
  --enamel:#3d71da; --enamel-deep:#2851a8; --on-enamel:#ffffff;
  --mango:#f4b131; --mango-deep:#c1840f; --on-mango:#2b1d00;
  --good:#3cc26a; --good-deep:#25904b; --good-tint:#12301f;
  --bad:#ff5e64; --bad-deep:#c23b41; --bad-tint:#3a191d;
  --guide:#2f4572; --slate:#10192b; --stroke:#f1f5ff; --baseline:#a57820;
  --locked:#222f4a; --locked-deep:#18223a; --locked-ink:#5f6f8f;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.naskh{font-family:var(--naskh);font-weight:500}
.ar{direction:rtl;unicode-bidi:isolate}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* ---------- Home ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--naskh);font-size:30px;line-height:1;color:var(--enamel);font-weight:600}
.brand span{font-weight:800;font-size:20px;letter-spacing:.01em}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.stat svg{width:22px;height:22px}
.stat.flame{color:var(--mango-deep)}
.stat.flame.off{color:var(--locked-ink)}
.stat.xp{color:var(--enamel)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}

.home{max-width:640px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.goal h2{margin:0;font-size:17px;font-weight:700}
.goal p{margin:0;color:var(--muted);font-size:15px;grid-column:1}
.goal .meter{grid-column:1/-1;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.goal .meter span{display:block;height:100%;width:0;background:var(--mango);border-radius:99px;transition:width .5s}
.goal .num{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mango-deep)}
.btn-practice{grid-row:1/3;grid-column:2}

.unit{display:flex;flex-direction:column;gap:6px}
.plaque{background:var(--enamel);color:var(--on-enamel);border-radius:10px;padding:6px;box-shadow:0 4px 0 var(--enamel-deep)}
.plaque-in{border:2px solid color-mix(in srgb,var(--on-enamel) 85%,transparent);border-radius:6px;padding:10px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center}
.plaque .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.plaque h3{margin:0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.plaque p{margin:0;font-size:14.5px;opacity:.9;grid-column:1}
.plaque .ar-title{grid-row:1/4;grid-column:2;font-family:var(--naskh);font-size:30px;line-height:1.3;font-weight:600;direction:rtl;text-align:center;max-width:12ch}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:44px 0 10px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.node{width:78px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--locked);color:var(--locked-ink);box-shadow:0 7px 0 var(--locked-deep);font-family:var(--naskh);font-size:22px;line-height:1;font-weight:600;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--locked-deep)}
.node svg{width:32px;height:32px}
.stop.done .node{background:var(--enamel);color:var(--on-enamel);box-shadow:0 7px 0 var(--enamel-deep)}
.stop.done .node:active{box-shadow:0 2px 0 var(--enamel-deep)}
.stop.current .node{background:var(--mango);color:var(--on-mango);box-shadow:0 7px 0 var(--mango-deep);width:88px;height:82px}
.stop.current .node:active{box-shadow:0 2px 0 var(--mango-deep)}
.stop.open .node{background:var(--surface);color:var(--enamel);box-shadow:0 7px 0 var(--line);border:2px solid var(--line)}
.stop-label{font-size:13.5px;color:var(--muted);font-weight:600;max-width:150px;text-align:center;line-height:1.25}
.stop.current .stop-label{color:var(--ink)}
.bubble{position:absolute;bottom:calc(100% + 6px);background:var(--surface);border:2px solid var(--line);color:var(--mango-deep);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:3px 12px;border-radius:10px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border:2px solid var(--line);border-top:0;border-left:0;transform:translate(-50%,-55%) rotate(45deg)}
.check{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.check svg{width:12px;height:12px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:14px;padding:12px 22px;min-height:52px;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--enamel);color:var(--on-enamel);box-shadow:0 5px 0 var(--enamel-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--enamel-deep)}
.btn:disabled{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-deep);cursor:default;transform:none}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-deep);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:#fff}
.btn.mango{background:var(--mango);box-shadow:0 5px 0 var(--mango-deep);color:var(--on-mango)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;min-height:44px;font-weight:700;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.link{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.9}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);-webkit-user-select:none;user-select:none}
.lhead{max-width:860px;width:100%;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;box-sizing:border-box}
.bar{flex:1;height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 12%,transparent)}
.lbody{min-height:0;overflow:auto;display:flex}
.ex{max-width:860px;width:100%;margin:0 auto;padding-block:6px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box;min-height:100%}
.kicker{margin:0;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mango-deep)}
.prompt{margin:0;font-size:clamp(22px,3.2vw,30px);font-weight:700;line-height:1.2;text-wrap:balance}
.prompt .naskh{font-size:1.25em}
.sub{margin:-6px 0 0;color:var(--muted);font-size:16px}

.slate-zone{flex:1;min-height:280px;display:flex;flex-direction:column;gap:10px}
.slate-wrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.slate{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--slate);border:2px solid var(--line);border-radius:22px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;box-shadow:0 4px 0 var(--line)}
.slate-tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slate-tools .ghost{display:flex;align-items:center;gap:6px}
.slate-tools svg{width:18px;height:18px}
.pen-note{font-size:13.5px;color:var(--muted);text-align:center;margin:0}

.intro{display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:center}
.tile{width:min(34vw,200px);aspect-ratio:1;max-width:100%;border-radius:24px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-family:var(--naskh);font-size:clamp(84px,14vw,128px);line-height:1;color:var(--enamel);padding-bottom:12px;box-sizing:border-box}
.facts{display:grid;gap:6px;min-width:0}
.facts .name{font-size:28px;font-weight:800;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px;background:var(--surface)}
.chip i{font-style:normal;color:var(--muted);font-weight:600;margin-right:6px}
.note{margin:0;font-size:17px;max-width:60ch;color:var(--ink)}
.forms{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;direction:rtl}
.form{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;display:grid;justify-items:center;gap:0;direction:ltr}
.form b{font-family:var(--naskh);font-size:clamp(34px,6vw,48px);line-height:1.5;color:var(--ink);font-weight:500}
.form span{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.form.na b{color:var(--locked-ink)}
.rtl-note{grid-column:1/-1;margin:-4px 0 0;font-size:13.5px;color:var(--muted)}

.word-hero{display:grid;justify-items:center;gap:4px;padding:10px 0}
.word-hero .w{font-family:var(--naskh);font-size:clamp(64px,11vw,104px);line-height:1.5;color:var(--enamel);direction:rtl}
.word-hero .tr{font-size:26px;font-weight:800}
.word-hero .en{font-size:18px;color:var(--muted)}
.breakdown{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.bd{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:2px 12px 6px;display:grid;justify-items:center;min-width:52px}
.bd b{font-family:var(--naskh);font-size:32px;line-height:1.5;font-weight:500}
.bd span{font-size:13px;color:var(--muted);font-weight:700;direction:ltr}
.bd.gap{background:none;border:0;min-width:14px}

.stage{display:grid;place-items:center;padding:6px 0 4px}
.stage .big{font-family:var(--naskh);font-size:clamp(90px,15vw,150px);line-height:1.45;color:var(--enamel);direction:rtl}
.stage .big.word{font-size:clamp(60px,10vw,96px)}
.stage .lat{font-size:clamp(46px,8vw,72px);font-weight:800;color:var(--enamel);line-height:1.2}
.stage .tag{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:68px;padding:8px 14px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700}
.opt .naskh{font-size:40px;line-height:1.3}
.opt.sel{border-color:var(--enamel);background:color-mix(in srgb,var(--enamel) 10%,var(--surface));box-shadow:0 4px 0 var(--enamel);color:var(--enamel)}
.opt.right{border-color:var(--good);background:var(--good-tint);box-shadow:0 4px 0 var(--good);color:var(--good-deep)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);box-shadow:0 4px 0 var(--bad);color:var(--bad-deep)}
.opt:disabled{cursor:default}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.match .opt{min-height:64px}
.match .opt.done{opacity:.35;box-shadow:none;transform:none}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.lfoot.ok{background:var(--good-tint);border-color:transparent}
.lfoot.no{background:var(--bad-tint);border-color:transparent}
.lfoot-in{max-width:860px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-sizing:border-box}
.fb{flex:1;min-width:220px;display:grid;gap:2px}
.fb h4{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb h4 svg{width:26px;height:26px}
.fb p{margin:0;font-size:16px}
.lfoot.ok .fb{color:var(--good-deep)}
.lfoot.no .fb{color:var(--bad-deep)}
.fb .naskh{font-size:1.4em}
.fb .link{justify-self:start}
.lfoot .btn{min-width:170px;margin-left:auto}

.done-screen{display:grid;justify-items:center;text-align:center;gap:16px;padding-top:4vh}
.done-screen .seal{width:132px;height:132px;border-radius:50%;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;font-family:var(--naskh);font-size:46px;box-shadow:0 7px 0 var(--mango-deep);line-height:1}
.done-screen h2{margin:0;font-size:32px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:12px}
.tiles div{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 8px;display:grid}
.tiles b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.tiles span{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#060b16 45%,transparent);display:grid;align-items:end;justify-items:center}
.sheet{width:min(560px,100%);box-sizing:border-box;background:var(--surface);border-radius:22px 22px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px;border:2px solid var(--line);border-bottom:0}
.sheet h3{margin:0;font-size:22px;font-weight:800}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.toggle span{display:grid}
.toggle small{color:var(--muted);font-size:14px}
.toggle input{width:52px;height:30px;accent-color:var(--enamel)}

@media (max-width:620px){
  .intro{grid-template-columns:1fr;justify-items:center;text-align:center}
  .chips{justify-content:center}
  .forms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plaque .ar-title{font-size:24px}
  .opt .naskh{font-size:34px}
  .lfoot .btn{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 4px 10px;font-weight:700;font-size:13px;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--enamel)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--enamel)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.panel-h{margin:0;font-size:18px;font-weight:800}
.panel-title{margin:0;font-size:24px;font-weight:800;line-height:1.2;text-wrap:balance}
.muted{margin:0;color:var(--muted)}
.small{font-size:14.5px}
.due-panel{grid-template-columns:1fr auto;align-items:center;gap:16px}
.due-actions{display:grid;gap:10px}
.big-num{margin:2px 0;font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--enamel);display:flex;align-items:baseline;gap:10px}
.big-num span{font-size:18px;color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.lcell{border-radius:12px;padding:2px 4px 6px;display:grid;justify-items:center;border:2px solid var(--line);background:var(--surface-2);direction:ltr}
.lcell b{font-family:var(--naskh);font-size:28px;line-height:1.5;font-weight:500}
.lcell span{font-size:12px;font-weight:700;color:var(--muted)}
.lcell.s0{opacity:.45}
.lcell.s1{border-color:var(--mango);background:color-mix(in srgb,var(--mango) 12%,var(--surface))}
.lcell.s2{border-color:var(--enamel);background:color-mix(in srgb,var(--enamel) 12%,var(--surface))}
.lcell.s3{border-color:var(--good);background:var(--good-tint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);background:var(--surface-2)}
.legend i.s1{border-color:var(--mango)}.legend i.s2{border-color:var(--enamel)}.legend i.s3{border-color:var(--good);background:var(--good-tint)}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wstats div{border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:grid}
.wstats b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.wstats span{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.btn-review{grid-row:1/3;grid-column:2}

/* ---------- Stories ---------- */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.story-card{border:2px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:14px 14px 12px;display:grid;gap:2px;text-align:left;transition:transform .08s}
.story-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.sc-ar{font-family:var(--naskh);font-size:32px;line-height:1.5;color:var(--enamel);text-align:right}
.sc-en{font-weight:800;font-size:18px}
.sc-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.sc-meta svg{width:16px;height:16px}
.story-card.locked{opacity:.6}
.story-card.locked .sc-ar{color:var(--muted)}
.story-card.done .sc-meta{color:var(--good-deep)}
.story{display:grid;gap:14px}
.story-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.story-title{margin:0;font-family:var(--naskh);font-size:40px;line-height:1.4;color:var(--enamel);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--muted);min-height:40px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--enamel);color:var(--on-enamel)}
.lines{display:grid;gap:12px}
.line{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.line.fresh{border-color:var(--enamel);animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.line-row{display:flex;align-items:center;gap:10px}
.line-ar{flex:1;min-width:0;direction:rtl;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px}
.tok{border:0;background:none;padding:0 2px;border-radius:8px;display:inline-grid;justify-items:center;color:var(--ink)}
.tok:hover,.tok:focus-visible{background:color-mix(in srgb,var(--enamel) 12%,transparent)}
.tok-ar{font-family:var(--naskh);font-size:clamp(28px,4.4vw,36px);line-height:1.6;border-bottom:2px dotted color-mix(in srgb,var(--muted) 55%,transparent)}
.tok-tr{display:none;font-size:13px;font-weight:700;color:var(--muted);direction:ltr;line-height:1.1;padding-bottom:2px}
.show-tr .tok-tr{display:block}
.punct{font-family:var(--naskh);font-size:clamp(28px,4.4vw,36px);line-height:1.6;color:var(--muted);margin-inline-start:-8px}
.who{display:inline-flex;align-items:flex-end;color:var(--mango-deep)}
.who .tok{color:var(--mango-deep)}
.line-en{display:none;margin:2px 0 0;color:var(--muted);font-size:16px}
.show-en .line-en{display:block}
.wsheet{display:flex;justify-content:center;align-items:center;gap:14px}
.wsheet b{font-family:var(--naskh);font-size:64px;line-height:1.5;color:var(--enamel)}

/* ---------- Audio ---------- */
.spk{border:2px solid var(--line);background:var(--surface);color:var(--enamel);width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;vertical-align:middle;box-shadow:0 3px 0 var(--line);flex:none}
.spk svg{width:22px;height:22px}
.spk.big{width:52px;height:52px}
.spk.big svg{width:28px;height:28px}
.listen-btn{width:120px;height:120px;border-radius:32px;border:0;background:var(--enamel);color:var(--on-enamel);display:grid;place-items:center;box-shadow:0 7px 0 var(--enamel-deep)}
.listen-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--enamel-deep)}
.listen-btn svg{width:56px;height:56px}
.rec-top{display:flex;align-items:center;gap:12px}
.rec-top .meter{flex:1;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.rec-top .meter span{display:block;height:100%;background:var(--good);border-radius:99px}
.rec-top b{font-variant-numeric:tabular-nums}
.rec-list{display:grid}
.rec-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rec-row:first-child{border-top:0}
.rec-row.live{background:var(--bad-tint);border-radius:12px;padding-inline:10px}
.rec-text{flex:1;min-width:0;display:grid}
.rec-text b{font-family:var(--naskh);font-size:26px;line-height:1.5;font-weight:500;text-align:right}
.rec-text span{font-size:14px;color:var(--muted)}
.rec-btns{display:flex;gap:8px;align-items:center}
.ghost.icon{width:44px;padding:0;display:grid;place-items:center;color:var(--enamel)}
.ghost.icon svg{width:22px;height:22px}
.rec-btn{border:0;border-radius:12px;min-height:44px;padding:6px 14px;display:flex;align-items:center;gap:6px;font-weight:800;background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-deep)}
.rec-btn svg{width:20px;height:20px}
.rec-btn.on{animation:pulse 1s ease-in-out infinite}
.rec-btn:disabled{opacity:.6}
@keyframes pulse{50%{box-shadow:0 4px 0 var(--bad-deep),0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}

/* ---------- Vowels + joining ---------- */
.mark-ex{font-family:var(--naskh);font-size:44px;line-height:1.6;color:var(--ink)}
.lchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;direction:rtl}
.lchips b{font-family:var(--naskh);font-size:40px;line-height:1.4;min-width:58px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 8px 4px;font-weight:500;color:var(--enamel)}
.lchips .plus{font-weight:800;color:var(--muted);font-size:20px}
.sub .lchips{justify-content:flex-start;margin:6px 0 4px}
.join-mean{color:var(--muted);font-weight:600}
.join-demo{display:grid;gap:14px}
.join-demo>div{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.join-demo .arrow{font-size:24px;color:var(--muted);font-weight:800}
.join-demo>div>b{font-family:var(--naskh);font-size:46px;line-height:1.4;color:var(--ink);font-weight:500}
.join-demo small{color:var(--muted);font-size:14.5px;font-weight:600;flex-basis:100%}
.opt.seq .naskh{letter-spacing:.02em;word-spacing:.15em}
.seal.long{font-size:30px;width:auto;min-width:132px;padding:0 24px;border-radius:66px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,480px);box-shadow:0 8px 24px color-mix(in srgb,#000 25%,transparent)}
@media (max-width:620px){
  .due-panel{grid-template-columns:1fr}
  .story-title{font-size:32px}
}
</style>

<body>

<script>
"use strict";
/* ================= Content ================= */
const LETTERS = [
 {c:'ا',n:'alif',s:'aa',f:'a',note:'A long “aa”, or a seat for a vowel at the start of a word. It never joins the letter after it.',join:false},
 {c:'ب',n:'baa',s:'b',f:'b',note:'Like English b. A shallow tooth with one dot below.',dots:{n:1,p:'b'}},
 {c:'ت',n:'taa',s:'t',f:'t',note:'Like English t. Same tooth as ب, with two dots above.',dots:{n:2,p:'a'}},
 {c:'ث',n:'thaa',s:'th',f:'th',note:'“th” as in think in formal Arabic. In Egyptian speech it usually becomes t or s.',dots:{n:3,p:'a'}},
 {c:'ن',n:'nuun',s:'n',f:'n',note:'Like English n. A deeper bowl than ب, with one dot above.',dots:{n:1,p:'a'}},
 {c:'ي',n:'yaa',s:'y / ee',f:'y',note:'A consonant y, or a long “ee” or “ei”. Two dots below.',dots:{n:2,p:'b'}},
 {c:'ج',n:'giim',s:'g',f:'g',note:'In Egypt this is a hard g, as in “go”. Most other Arabs say j, so Egyptians are known for it.',dots:{n:1,p:'any'}},
 {c:'ح',n:'ḥaa',s:'ḥ',f:'7',note:'A breathy h from deep in the throat, like fogging up a mirror. Franco-Arabic writes it 7.'},
 {c:'خ',n:'khaa',s:'kh',f:'5',note:'A rough kh, like the end of Scottish “loch”. Franco-Arabic writes it 5 or kh.',dots:{n:1,p:'a'}},
 {c:'د',n:'daal',s:'d',f:'d',note:'Like English d. It never joins the letter after it.',join:false},
 {c:'ذ',n:'zaal',s:'dh / z',f:'z',note:'“th” as in this in formal Arabic. Egyptians usually say d or z instead.',join:false,dots:{n:1,p:'a'}},
 {c:'ر',n:'raa',s:'r',f:'r',note:'A tapped r. It dips below the line and never joins the letter after it.',join:false},
 {c:'ز',n:'zein',s:'z',f:'z',note:'Like English z. It is ر with a dot on top.',join:false,dots:{n:1,p:'a'}},
 {c:'و',n:'waaw',s:'w / oo',f:'w',note:'A consonant w, or a long “oo” or “o”. It never joins the letter after it.',join:false},
 {c:'س',n:'siin',s:'s',f:'s',note:'Like English s. Three small teeth and a bowl.'},
 {c:'ش',n:'shiin',s:'sh',f:'sh',note:'Like English sh. The same shape as س with three dots on top.',dots:{n:3,p:'a'}},
 {c:'ص',n:'ṣaad',s:'ṣ',f:'s',note:'A heavy s: pull your tongue back and it darkens the vowels around it.'},
 {c:'ض',n:'ḍaad',s:'ḍ',f:'d',note:'A heavy d. Arabic is called “the language of ḍaad” because this sound is so rare.',dots:{n:1,p:'a'}},
 {c:'ط',n:'ṭaa',s:'ṭ',f:'6',note:'A heavy t. Franco-Arabic writes it 6.'},
 {c:'ظ',n:'ẓaa',s:'ẓ',f:"6'",note:'A heavy “th” in formal Arabic. Egyptians mostly say a heavy z.',dots:{n:1,p:'any'}},
 {c:'ع',n:'ʿein',s:'ʿ',f:'3',note:'A squeeze in the throat with no English match. Franco-Arabic writes it 3.'},
 {c:'غ',n:'ghein',s:'gh',f:"3'",note:'A gargled gh, close to a French r. Franco-Arabic writes it gh.',dots:{n:1,p:'a'}},
 {c:'ف',n:'faa',s:'f',f:'f',note:'Like English f. A small loop with one dot.',dots:{n:1,p:'a'}},
 {c:'ق',n:'ʾaaf',s:'ʾ / q',f:'2',note:'In Cairo this is a glottal stop, the catch in “uh-oh”. You only hear a real q in formal words like Qurʾaan.',dots:{n:2,p:'a'}},
 {c:'ك',n:'kaaf',s:'k',f:'k',note:'Like English k. The small mark inside is part of the letter, not a dot.',dots:{n:0,extra:true}},
 {c:'ل',n:'laam',s:'l',f:'l',note:'Like English l. ل followed by ا makes a special joined shape: لا (la).'},
 {c:'م',n:'miim',s:'m',f:'m',note:'Like English m. A small round loop with a tail.'},
 {c:'ه',n:'haa',s:'h',f:'h',note:'A light English h. Its shape changes a lot between the start, middle and end of a word.'},
 {c:'ة',n:'taaʾ marbuuṭa',s:'-a',f:'a',note:'Only ever at the end of a word, where it sounds like “-a”. It looks like ه with two dots.',join:false,endOnly:true,dots:{n:2,p:'a'}},
 {c:'ء',n:'hamza',s:'ʾ (catch)',f:'2',note:'A catch in the throat, like the break in “uh-oh”. It often sits on a seat: أ at the start of a word, إ under an i-sound.',join:false,aloneOnly:true,noWrite:true},
];
const AUX = {'أ':'ʾa','إ':'ʾe','آ':'ʾaa','ى':'a','ؤ':'ʾ','ئ':'ʾ'};
const LMAP = {}; LETTERS.forEach(l => LMAP[l.c] = l);
const FAMILIES = [['ب','ت','ث'],['ج','ح','خ'],['د','ذ'],['ر','ز'],['س','ش'],['ص','ض'],['ط','ظ'],['ع','غ'],['ف','ق'],['ه','ة']];
const LOOKALIKE = [['ب','ت','ث','ن','ي'],['ج','ح','خ'],['د','ذ','ر','ز','و'],['س','ش','ص','ض'],['ط','ظ','ع','غ'],['ف','ق','و','م'],['ا','ل','ك'],['ه','ة','م']];
const famOf = c => (FAMILIES.find(f => f.includes(c)) || [c]);
const lookOf = c => LOOKALIKE.filter(f => f.includes(c)).flat();

const W = (ar,tr,en,note) => ({ar,tr,en,note});
const HARAKAT = /[ً-ْٰ]/g;
const plain = s => s.replace(HARAKAT,'').replace(/ـ/g,'');
const MARKS = [
 {m:'َ', n:'fatḥa', v:'a', ex:'بَ تَ سَ', note:'A small slash above the letter: a short “a”. بَ is “ba”.'},
 {m:'ِ', n:'kasra', v:'i', ex:'بِ تِ سِ', note:'A small slash below the letter: a short “i”. In Egyptian it often sounds closer to “e”. بِ is “bi”.'},
 {m:'ُ', n:'ḍamma', v:'u', ex:'بُ تُ سُ', note:'A tiny و above the letter: a short “u”, often closer to “o” in Egyptian. بُ is “bu”.'},
 {m:'ْ', n:'sukuun', v:'', ex:'بِنْت', note:'A small circle above: no vowel after this letter. In بِنْت the ن has a sukuun, so it is “bint”, not “binat”.'},
 {m:'ّ', n:'shadda', v:'', ex:'مَيَّة', note:'A small w-shape above: say the letter twice as long. حُبّ is “ḥubb”, مَيَّة is “mayya”.'},
];
const MMAP = {}; MARKS.forEach(x => MMAP[x.m] = x);
const CONS = {'ي':'y','و':'w','ق':'ʾ','ء':'ʾ','ذ':'z','ث':'th','ج':'g','ح':'ḥ','خ':'kh','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh'};
const cons = c => CONS[c] || LMAP[c].s;
const NONJOIN = ['ا','د','ذ','ر','ز','و'];

const UNITS = [
 {ar:'ا ب ت ث ن ي', en:'Tooth letters', desc:'One tooth shape, five letters. The dots tell them apart.', lessons:[
   {t:'L', letters:['ا','ب','ت']},
   {t:'L', letters:['ث','ن','ي']},
   {t:'W', words:[W('باب','baab','door'),W('بيت','beit','house'),W('بنت','bint','girl'),W('تين','tiin','figs'),W('اتنين','itnein','two','Egyptians write and say ت here, where formal Arabic has ث.'),W('بنات','banaat','girls')]},
   {t:'R'} ]},
 {ar:'ج ح خ', en:'Bowl letters', desc:'Three letters, one bowl. Watch for the Egyptian hard g.', lessons:[
   {t:'L', letters:['ج','ح','خ']},

/* Letters a piece of text needs, with hamza seats counted as ء plus their seat */
function lettersIn(text){
  const out = new Set();
  for (const ch of plain(text)){
    if (ch === 'أ' || ch === 'إ' || ch === 'آ'){ out.add('ء'); out.add('ا'); }
    else if (ch === 'ؤ'){ out.add('ء'); out.add('و'); }
    else if (ch === 'ئ'){ out.add('ء'); out.add('ي'); }
    else if (ch === 'ى') out.add('ي');
    else if (LMAP[ch]) out.add(ch);
  }
  return out;
}

async function api(method, path, body){
  const r = await fetch(path, {method, credentials:'same-origin', headers: body !== undefined ? {'Content-Type':'application/json'} : {}, body: body !== undefined ? JSON.stringify(body) : undefined});
  let data = {}; try { data = await r.json(); } catch(e) {}

}
function cacheLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function save(){

async function pushRemote(){
  if (!authed) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const r = await api('PUT', '/api/progress', S);
    if (r.status === 200) syncState = 'cloud';
    else if (r.status === 409 && r.data.progress) { syncState = 'cloud'; adopt(r.data.progress); }
    else if (r.status === 401) { authed = false; syncState = 'local'; showLogin(); }
    else syncState = 'error';
  } catch(e) { syncState = 'offline'; }
  saving = false;
  if (saveAgain) { saveAgain = false; pushRemote(); }
}
async function pullRemote(){
  try {
    const r = await api('GET', '/api/progress');
    if (r.status === 401) { authed = false; return showLogin(); }
    if (r.status !== 200) { syncState = 'error'; return; }
    syncState = 'cloud';
    const remote = r.data.progress;
    if (remote && (remote.updated||0) > (S.updated||0)) adopt(remote);
    else if (S.updated && (!remote || (S.updated||0) > (remote.updated||0))) pushRemote();
  } catch(e) { syncState = 'offline'; }
}

  const c = S.srs[id] || (S.srs[id] = {b:0, d:0});
  if (ok){ c.d = Date.now() + INT[c.b]*DAY; c.b = Math.min(c.b + 1, INT.length - 1); }
  else { c.b = 0; c.d = Date.now() + 10*60e3; }
}
const dueIds = () => { const now = Date.now(); return Object.entries(S.srs).filter(([id,c]) => c.d <= now && cardKnown(id)).sort((a,b) => a[1].d - b[1].d).map(([id]) => id); };
function cardKnown(id){ const [k, v] = [id.slice(0,1), id.slice(2)]; return k === 'L' ? !!LMAP[v] : k === 'V' ? !!VIDX[v] : !!WIDX[v]; }
function nextDueIn(){ const ds = Object.values(S.srs).map(c => c.d).filter(d => d > Date.now()); return ds.length ? Math.min(...ds) - Date.now() : null; }
function lessonCards(l){
  const ids = [];
  (l.letters||[]).forEach(c => ids.push('L:'+c));
  (l.words||[]).forEach(w => ids.push(l.t === 'V' ? 'V:'+w.ar : 'W:'+plain(w.ar)));

}

/* ================= Recordings ================= */
function akey(text){
  const s = plain(text).replace(/[.!؟،?,:]/g,'').replace(/\s+/g,' ').trim();
  let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0; }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
let AUD = {};
const hasAudio = t => !!AUD[akey(t)];
let curAudio = null;
function playAudio(t){
  const k = akey(t); if (!AUD[k]) return false;
  try { if (curAudio) curAudio.pause(); curAudio = new Audio(`/api/audio/${k}?v=${AUD[k].ts||0}`); curAudio.play().catch(()=>{}); } catch(e) {}
  return true;
}
async function loadAudioIndex(){
  try { const r = await api('GET', '/api/audio'); if (r.status === 200){ AUD = r.data.index || {}; refreshViews(); } } catch(e) {}
}

$('#view-record').addEventListener('click', e => {

  const b = e.target.closest('[data-rec]'); if (!b) return;
  if (REC.text === b.dataset.rec) recStop(); else recStart(b.dataset.rec);

async function recStart(text){
  if (REC.mr) recStop();
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('This browser can’t record audio.');
  try { REC.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ return toast('Microphone access is blocked. Allow it for this site in Safari settings.'); }
  const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  REC.mr = new MediaRecorder(REC.stream, type ? {mimeType:type} : undefined);
  REC.chunks = []; REC.text = text;
  REC.mr.ondataavailable = ev => { if (ev.data && ev.data.size) REC.chunks.push(ev.data); };
  REC.mr.onstop = recSave;
  REC.mr.start();
  REC.timer = setTimeout(recStop, 8000);
  renderRecord();
}
function recStop(){ clearTimeout(REC.timer); if (REC.mr && REC.mr.state !== 'inactive') REC.mr.stop(); }
async function recSave(){
  const type = (REC.mr.mimeType || 'audio/mp4').split(';')[0];
  const blob = new Blob(REC.chunks, {type});
  if (REC.stream) REC.stream.getTracks().forEach(t => t.stop());
  const text = REC.text; REC.mr = null; REC.stream = null; REC.text = null;
  if (blob.size < 800){ renderRecord(); return toast('Nothing was recorded. Try again and speak after tapping.'); }
  REC.busy = text; renderRecord();
  const k = akey(text);
  try {
    const r = await fetch('/api/audio/' + k, {method:'PUT', headers:{'Content-Type':type, 'X-Text':encodeURIComponent(plain(text))}, body:blob});
    if (r.ok){ const d = await r.json(); AUD[k] = {t:plain(text), ts:d.ts || Date.now()}; playAudio(text); }
    else if (r.status === 401){ authed = false; showLogin(); }
    else toast('That recording couldn’t be saved. Try again.');
  } catch(e){ toast('You seem to be offline, so the recording wasn’t saved.'); }
  REC.busy = null; renderRecord(); renderHeader();
}

/* ================= Exercise builders ================= */
const soundOpts = (c, pool) => {
  const want = new Set([LMAP[c].s]); const out = [c];
  const cands = [...shuffle(lookOf(c)), ...shuffle(pool), ...shuffle(LETTERS.slice(0,12).map(l=>l.c))];
  for (const x of cands) { if (out.length >= 4) break; const l = LMAP[x]; if (!l || l.aloneOnly || want.has(l.s)) continue; want.add(l.s); out.push(x); }
  return shuffle(out);
};
function mcLS(c, pool){ const o = soundOpts(c, pool); return {t:'mc', card:'L:'+c, kicker:'Read', prompt:'What sound does this letter make?', big:c, say:c, opts:o.map(x=>({label:LMAP[x].s})), ans:o.indexOf(c), explain:`${c} is ${LMAP[c].n}: “${LMAP[c].s}”.`}; }
function mcSL(c, pool){ const o = soundOpts(c, pool); return {t:'mc', card:'L:'+c, kicker:'Recognise', prompt:`Which letter says “${LMAP[c].s}”?`, lat:LMAP[c].s, opts:o.map(x=>({label:x, ar:true})), ans:o.indexOf(c), explain:`“${LMAP[c].s}” is ${c} (${LMAP[c].n}).`}; }
function mcForm(c, pool){
  const f = formsOf(c); const keys = Object.keys(f).filter(k => k !== 'alone' && f[k] !== c);
  if (!keys.length) return null;
  const k = pick(keys), names = {start:'start of a word', mid:'middle of a word', end:'end of a word'};
  const o = soundOpts(c, pool).filter(x => !LMAP[x].aloneOnly);
  return {t:'mc', card:'L:'+c, kicker:'Letter shapes', prompt:'Which letter is this?', big:f[k], tag:`as it looks at the ${names[k]}`, opts:o.map(x=>({label:x, ar:true})), ans:o.indexOf(c), explain:`${f[k]} is ${c} (${LMAP[c].n}) joined to its neighbours.`};
}
const wordPool = (pool, w) => shuffle((pool && pool.length >= 4 ? pool : ALLWORDS).filter(x => plain(x.ar) !== plain(w.ar) && x.en !== w.en));
function fill4(w, pool){ const o = [w, ...wordPool(pool, w).slice(0,3)]; for (const x of shuffle(ALLWORDS)){ if (o.length >= 4) break; if (!o.some(y => plain(y.ar) === plain(x.ar) || y.en === x.en)) o.push(x); } return shuffle(o); }
function mcRead(w, pool){ const s = fill4(w, pool); return {t:'mc', card:'W:'+plain(w.ar), kicker:'Read', prompt:'What does this say?', big:w.ar, word:true, say:w.ar, opts:s.map(x=>({label:`${x.tr} · ${x.en}`})), ans:s.indexOf(w), explain:`${w.ar} = ${w.tr}, “${w.en}”.`}; }
function mcMean(w, pool){ const s = fill4(w, pool); return {t:'mc', card:'W:'+plain(w.ar), kicker:'Recognise', prompt:`Which one means “${w.en}”?`, lat:w.tr, small:true, opts:s.map(x=>({label:x.ar, ar:true})), ans:s.indexOf(w), explain:`“${w.en}” is ${w.ar} (${w.tr}).`}; }
function mcListen(w, pool){ const s = fill4(w, pool); return {t:'mc', card:'W:'+plain(w.ar), kicker:'Listen', prompt:'Which word did you hear?', listen:w.ar, opts:s.map(x=>({label:x.ar, ar:true})), ans:s.indexOf(w), explain:`You heard ${w.ar} (${w.tr}), “${w.en}”.`}; }
function matchLetters(cs){ return {t:'match', kicker:'Match', prompt:'Match each letter to its sound', pairs: shuffle(cs).slice(0,5).map(c => [c, LMAP[c].s])}; }
function matchWords(ws){ return {t:'match', kicker:'Match', prompt:'Match each word to its meaning', pairs: shuffle(ws).filter((w,i,a)=>a.findIndex(x=>x.en===w.en)===i).slice(0,5).map(w => [w.ar, w.en])}; }

const trace = c => ({t:'trace', text:c, letter:LMAP[c] ? c : null, word:!LMAP[c]});
const write = (text, w) => ({t:'write', text:plain(text), letter:LMAP[text] ? text : null, word:!LMAP[text], w, card: LMAP[text] ? 'L:'+text : w ? 'W:'+plain(w.ar) : null});

/* vowel marks */
const SYL = c => !['ا','ة','ء','و','ي'].includes(c);
function mcSyl(c, mk, marks){
  const ms = marks.includes('ْ') ? ['َ','ِ','ُ','ْ'] : ['َ','ِ','ُ'];
  const o = shuffle(ms);
  return {t:'mc', kicker:'Vowel marks', prompt:'How do you say this?', big:c+mk, opts:o.map(m => ({label: cons(c) + MMAP[m].v})), ans:o.indexOf(mk), explain:`${c+mk}: ${MMAP[mk].n} on ${c}, so “${cons(c)+MMAP[mk].v}”.`};
}
function mcSylRev(c, mk){
  const o = shuffle(['َ','ِ','ُ']);
  return {t:'mc', kicker:'Vowel marks', prompt:`Which one says “${cons(c)+MMAP[mk].v}”?`, lat:cons(c)+MMAP[mk].v, opts:o.map(m => ({label:c+m, ar:true})), ans:o.indexOf(mk), explain:`“${cons(c)+MMAP[mk].v}” is ${c+mk}, with a ${MMAP[mk].n}.`};
}
function vowelVariants(tr){
  const out = new Set(), idx = [];
  for (let i=0;i<tr.length;i++) if ('aiu'.includes(tr[i]) && tr[i-1] !== tr[i] && tr[i+1] !== tr[i]) idx.push(i);
  for (const i of shuffle(idx)) for (const v of shuffle(['a','i','u'])) if (v !== tr[i]) out.add(tr.slice(0,i) + v + tr.slice(i+1));
  if (/(.)\1/.test(tr)) out.add(tr.replace(/(.)\1/, '$1'));
  return shuffle([...out]);
}
function mcSound(w){
  const v = vowelVariants(w.tr).slice(0,3);
  for (const x of shuffle(VWORDS)){ if (v.length >= 3) break; if (x.tr !== w.tr && !v.includes(x.tr)) v.push(x.tr); }
  const o = shuffle([w.tr, ...v]);
  return {t:'mc', card:'V:'+w.ar, kicker:'Sound it out', prompt:'Read the vowel marks. How does it sound?', big:w.ar, word:true, say:w.ar, opts:o.map(x => ({label:x})), ans:o.indexOf(w.tr), explain:`${w.ar} is “${w.tr}”, ${w.en}.`};
}

/* joined writing */
const lettersOf = w => [...plain(w.ar)].filter(c => c !== ' ');
const sepStr = arr => arr.join('  ');
function mcJoin(w, pool){
  const ls = lettersOf(w), rev = [...ls].reverse().join('');
  const o = [plain(w.ar)];
  if (rev !== o[0]) o.push(rev);
  for (const x of wordPool(pool, w)){ if (o.length >= 4) break; const p = plain(x.ar); if (!o.includes(p) && !p.includes(' ')) o.push(p); }
  const s = shuffle(o);
  return {t:'mc', card:'W:'+plain(w.ar), kicker:'Join the letters', prompt:'Which word do these letters make?', chips:ls, opts:s.map(x => ({label:x, ar:true})), ans:s.indexOf(o[0]), explain:`${sepStr(ls)} joins up as ${w.ar} (${w.tr}).`};
}
function mcSplit(w, pool){
  const ls = lettersOf(w), right = sepStr(ls), opts = [right];
  const rev = sepStr([...ls].reverse()); if (rev !== right) opts.push(rev);
  const j = ls.findIndex(c => famOf(c).length > 1);
  if (j >= 0){ const alt = famOf(ls[j]).find(c => c !== ls[j]); const sw = [...ls]; sw[j] = alt; opts.push(sepStr(sw)); }
  for (const x of wordPool(pool, w)){ if (opts.length >= 4) break; const s = sepStr(lettersOf(x)); if (!opts.includes(s) && !x.ar.includes(' ')) opts.push(s); }
  const s = shuffle(opts.slice(0,4));
  return {t:'mc', card:'W:'+plain(w.ar), kicker:'Split the word', prompt:'Which letters is this word made of?', big:w.ar, word:true, tag:'Remember: Arabic runs right to left', opts:s.map(x => ({label:x, ar:true, seq:true})), ans:s.indexOf(right), explain:`${w.ar} is ${right}, read from the right.`};
}
const joinWrite = w => Object.assign(write(w.ar, w), {join:true});

/* one exercise for a review card */
function learnedLetters(){ const s = new Set(lettersUpTo(firstOpen()-1)); Object.keys(S.srs).forEach(id => { if (id[0] === 'L') s.add(id.slice(2)); }); return [...s].filter(c => LMAP[c] && !LMAP[c].aloneOnly); }
function cardItem(id, pool, wpool){
  const k = id[0], v = id.slice(2);
  if (k === 'L'){
    if (LMAP[v].aloneOnly) return mcSL(v, pool);
    const r = Math.random(), f = mcForm(v, pool);
    if (r < 0.3) return write(v);
    if (r < 0.5 && f) return f;
    return r < 0.75 ? mcLS(v, pool) : mcSL(v, pool);
  }
  if (k === 'V') return mcSound(VIDX[v]);
  const w = WIDX[v];
  const opts = [() => mcRead(w, wpool), () => mcMean(w, wpool)];
  if (hasAudio(w.ar)) opts.push(() => mcListen(w, wpool), () => mcListen(w, wpool));
  if (!w.ar.includes(' ') && plain(w.ar).length <= 5){ opts.push(() => write(w.ar, w)); if (plain(w.ar).length >= 3) opts.push(() => mcSplit(w, wpool)); }
  return pick(opts)();
}
function cardsToItems(ids){
  const pool = learnedLetters(), wpool = ALLWORDS;
  const items = ids.map(id => cardItem(id, pool.length >= 4 ? pool : LETTERS.slice(0,8).map(l=>l.c), wpool));
  const writes = items.filter(x => x.t === 'write'), rest = items.filter(x => x.t !== 'write');
  return [...rest, ...writes];
}

/* ================= Lessons ================= */
function buildLesson(i){
  const L = LESSONS[i], pool = lettersUpTo(i).filter(c=>!LMAP[c].aloneOnly), wpool = Object.values(WIDX).filter(w => ALLWORDS.includes(w));
  const items = [];
  (L.intro||[]).forEach(c => items.push({t:'introL', c}));
  if (L.t === 'L') {
    L.letters.forEach(c => { items.push({t:'introL', c}); items.push(trace(c)); });
    const mixed = [];
    L.letters.forEach((c,k) => { mixed.push(k % 2 ? mcSL(c,pool) : mcLS(c,pool)); mixed.push(write(c)); });
    shuffle(L.letters).slice(0,2).forEach(c => { const f = mcForm(c,pool); if (f) mixed.push(f); });
    if (pool.length > L.letters.length) mixed.push(mcLS(pick(pool.filter(c=>!L.letters.includes(c))), pool));
    items.push(...shuffle(mixed));
    const m = [...L.letters, ...shuffle(pool.filter(c=>!L.letters.includes(c)))].slice(0,4);
    items.push(matchLetters(m.length >= 3 ? m : [...m, ...LETTERS.slice(0,4).map(l=>l.c)].filter((v,j,a)=>a.indexOf(v)===j).slice(0,4)));
    return items;
  }
  if (L.t === 'W') {
    L.words.forEach(w => items.push({t:'introW', w}));
    const ws = shuffle(L.words), mixed = [];
    ws.slice(0,4).forEach(w => mixed.push(mcRead(w, wpool)));
    ws.slice(0,2).forEach(w => mixed.push(mcMean(w, wpool)));
    ws.filter(w => hasAudio(w.ar)).slice(0,2).forEach(w => mixed.push(mcListen(w, wpool)));
    items.push(...shuffle(mixed));
    const short = shuffle(L.words.filter(w => plain(w.ar).length <= 5 && !w.ar.includes(' ')));
    short.slice(0,2).forEach(w => items.push(trace(plain(w.ar))));
    (short.length >= 4 ? short.slice(2,4) : short.slice(0,2)).forEach(w => items.push(write(w.ar, w)));
    items.push(matchWords(L.words));
    return items;
  }
  if (L.t === 'V') {
    (L.marks||[]).forEach(m => items.push({t:'introMark', m}));
    const cs = shuffle(pool.filter(SYL));
    if (L.marks){
      const mixed = [];
      cs.slice(0,6).forEach((c,k) => { const mk = L.marks[k % L.marks.length]; if (mk === 'ّ') return; mixed.push(k % 2 ? mcSylRev(c, mk === 'ْ' ? 'َ' : mk) : mcSyl(c, mk, L.marks)); });
      items.push(...mixed);
    }
    const ws = shuffle(L.words);
    ws.slice(0,3).forEach(w => items.push({t:'introW', w, vowel:true}));
    items.push(...shuffle(ws.slice(0,5).map(w => mcSound(w))));
    ws.slice(0,2).forEach(w => items.push(Object.assign(mcMean(w, ws), {card:'V:'+w.ar})));
    items.push(matchSounds(L.words));
    return items;
  }
  if (L.t === 'J') {
    items.push({t:'introJoin', breaks:!!L.breaks});
    const ws = shuffle(L.words), mixed = [];
    ws.slice(0,3).forEach(w => mixed.push(mcJoin(w, L.words)));
    ws.slice(3,6).forEach(w => mixed.push(mcSplit(w, L.words)));
    items.push(...shuffle(mixed));
    const longW = ws.slice().sort((a,b) => plain(b.ar).length - plain(a.ar).length)[0];
    items.push(trace(plain(longW.ar)));
    ws.filter(w => w !== longW).slice(0,3).forEach(w => items.push(joinWrite(w)));
    items.push(matchWords(L.words));
    return items;
  }
  // unit review
  const U = UNITS[L.unit];
  const ids = [...new Set(U.lessons.flatMap(lessonCards))];
  const out = cardsToItems(shuffle(ids).slice(0, 12));
  const uw = U.lessons.filter(l => l.t !== 'V').flatMap(l => l.words || []), vw = U.lessons.filter(l => l.t === 'V').flatMap(l => l.words || []);
  const ul = U.lessons.flatMap(l => l.letters || []);
  out.push(vw.length ? matchSounds(vw) : uw.length >= 3 ? matchWords(uw) : matchLetters(ul.length >= 3 ? ul : pool.slice(-5)));
  return out;
}
function buildPractice(){
  const ids = Object.keys(S.srs).filter(cardKnown);
  const pick12 = shuffle(ids.length ? ids : lessonCards(LESSONS[0])).slice(0, 12);
  return cardsToItems(pick12);
}
function buildDue(){ return cardsToItems(dueIds().slice(0, 15)); }
function buildStory(st){
  const items = [{t:'story', st}];
  st.qs.forEach(([q, opts]) => { const o = shuffle(opts); items.push({t:'mc', kicker:'Check your understanding', prompt:q, opts:o.map(x => ({label:x})), ans:o.indexOf(opts[0]), explain:`The answer is: ${opts[0]}.`}); });
  return items;

/* ================= Glyph layout + grading ================= */
const NASKH = '"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif';
const fontsReady = (async () => {
  try { await Promise.race([Promise.all([
    document.fonts.load(`500 60px "Noto Naskh Arabic"`, 'ابتثجحخدذرزسشصضطظعغفقكلمنهويةءأإ'),
    document.fonts.load(`700 20px "Baloo Bhaijaan 2"`, 'abc')]), new Promise(r=>setTimeout(r,4000))]); } catch(e) {}
})();
function layoutGlyph(ctx, text, Wd, Ht, word){
  let size = Ht * (word ? 0.5 : 0.6);
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `500 ${size}px ${NASKH}`;
  let m = ctx.measureText(text);
  let w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const sc = Math.min(1.25, (Wd*0.8)/Math.max(w,1), (Ht*0.74)/Math.max(h,1));
  size *= sc; ctx.font = `500 ${size}px ${NASKH}`; m = ctx.measureText(text);
  const x = Wd/2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft)/2;
  const y = Ht/2 - (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent)/2;
  return {x, y, size};
}
function drawGlyph(ctx, text, Wd, Ht, word, color){
  const g = layoutGlyph(ctx, text, Wd, Ht, word);
  ctx.fillStyle = color; ctx.fillText(text, g.x, g.y); return g;
}
const GH = 112;
function mkCanvas(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toMask(c){
  const ctx = c.getContext('2d', {willReadFrequently:true});
  const d = ctx.getImageData(0,0,c.width,c.height).data, w=c.width, h=c.height, m = new Uint8Array(w*h);
  let n = 0, x0=w, y0=h, x1=-1, y1=-1;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (d[(y*w+x)*4+3] > 90){ m[y*w+x]=1; n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  return {m, n, w, h, box:{x0,y0,x1,y1}};
}
function dilate(src, w, h, r){
  const tmp = new Uint8Array(w*h), out = new Uint8Array(w*h);
  for (let y=0;y<h;y++){ const o=y*w; let last=-1e9;
    for (let x=0;x<w;x++){ if (src[o+x]) last=x; if (x-last<=r) tmp[o+x]=1; }
    last=1e9; for (let x=w-1;x>=0;x--){ if (src[o+x]) last=x; if (last-x<=r) tmp[o+x]=1; } }
  for (let x=0;x<w;x++){ let last=-1e9;
    for (let y=0;y<h;y++){ if (tmp[y*w+x]) last=y; if (y-last<=r) out[y*w+x]=1; }
    last=1e9; for (let y=h-1;y>=0;y--){ if (tmp[y*w+x]) last=y; if (last-y<=r) out[y*w+x]=1; } }
  return out;
}
const tCache = new Map();
function targetMask(text, word){
  const key = text + '|' + word;
  if (tCache.has(key)) return tCache.get(key);
  const gw = word ? GH*2 : GH, c = mkCanvas(gw, GH);
  drawGlyph(c.getContext('2d'), text, gw, GH, word, '#000');
  const t = toMask(c); t.dil = {}; tCache.set(key, t); return t;
}
function userMask(strokes, gw, gh, tf){
  const c = mkCanvas(gw, gh), ctx = c.getContext('2d');
  ctx.strokeStyle = ctx.fillStyle = '#000'; ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = gh*0.045;
  const P = p => [p.x*gw*tf.sx + tf.tx, p.y*gh*tf.sy + tf.ty];
  strokes.forEach(s => {
    if (s.length === 1){ const [x,y] = P(s[0]); ctx.beginPath(); ctx.arc(x,y,ctx.lineWidth/2,0,7); ctx.fill(); return; }
    ctx.beginPath(); s.forEach((p,i) => { const [x,y] = P(p); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); ctx.stroke();

}
function chamfer(mask, w, h){
  const d = new Float32Array(w*h), D = 1.4142;
  for (let i=0;i<d.length;i++) d[i] = mask[i] ? 0 : 1e6;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const i=y*w+x; let v=d[i];
    if (x>0) v=Math.min(v,d[i-1]+1);
    if (y>0){ v=Math.min(v,d[i-w]+1); if (x>0) v=Math.min(v,d[i-w-1]+D); if (x<w-1) v=Math.min(v,d[i-w+1]+D); }
    d[i]=v; }
  for (let y=h-1;y>=0;y--) for (let x=w-1;x>=0;x--){ const i=y*w+x; let v=d[i];
    if (x<w-1) v=Math.min(v,d[i+1]+1);
    if (y<h-1){ v=Math.min(v,d[i+w]+1); if (x<w-1) v=Math.min(v,d[i+w+1]+D); if (x>0) v=Math.min(v,d[i+w-1]+D); }
    d[i]=v; }

}
function prepTarget(T){
  if (T.dt) return T;
  const {w,h,m} = T;
  T.dt = chamfer(m, w, h);
  const inv = new Uint8Array(w*h); for (let i=0;i<m.length;i++) inv[i] = m[i] ? 0 : 1;
  const din = chamfer(inv, w, h), sk = [];
  for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){ const i=y*w+x; if (!m[i]) continue; const v=din[i];
    if (v>=din[i-1] && v>=din[i+1] && v>=din[i-w] && v>=din[i+w]) sk.push(i); }
  T.sk = sk; T.size = Math.max(T.box.x1-T.box.x0, T.box.y1-T.box.y0, 1);

}
/* Mean distance from your ink to the letter (dUT) and from the letter's centre-line to your ink (dTU), as a fraction of letter size. */
function shapeDist(U, T){
  prepTarget(T);
  if (!U.n || !T.n) return {D:1, dUT:1, dTU:1};
  const du = chamfer(U.m, U.w, U.h);
  let a=0; for (let i=0;i<U.m.length;i++) if (U.m[i]) a += T.dt[i];

function ptsBox(strokes, gw, gh){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s => s.forEach(p => { const x=p.x*gw, y=p.y*gh; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }));
  return {x0,y0,x1,y1};
}
function fitTf(ub, T, gh){
  const sh = gh*0.022, tb = {x0:T.box.x0+sh, x1:T.box.x1-sh, y0:T.box.y0+sh, y1:T.box.y1-sh};
  const uw = Math.max(ub.x1-ub.x0, 1e-3), uh = Math.max(ub.y1-ub.y0, 1e-3);
  const tw = Math.max(tb.x1-tb.x0, 1), th = Math.max(tb.y1-tb.y0, 1);
  let sx = tw/uw, sy = th/uh;
  if (uw < uh*0.18) sx = sy; else if (uh < uw*0.18) sy = sx;
  const g = Math.sqrt(sx*sy); sx = clamp(sx, g*0.7, g*1.43); sy = clamp(sy, g*0.7, g*1.43);
  return {sx, sy, tx:(tb.x0+tb.x1)/2 - (ub.x0+ub.x1)/2*sx, ty:(tb.y0+tb.y1)/2 - (ub.y0+ub.y1)/2*sy};
}
function writeScore(strokes, text, word){
  const gw = word ? GH*2 : GH, T = targetMask(text, word);
  const tf = fitTf(ptsBox(strokes, gw, GH), T, GH);
  return shapeDist(userMask(strokes, gw, GH, tf), T);
}
function dotCheck(strokes, aspect, c){
  const spec = LMAP[c].dots || {n:0};
  const boxes = strokes.map(s => { let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; s.forEach(p => { const x=p.x*aspect, y=p.y; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }); return {x0,y0,x1,y1,w:x1-x0,h:y1-y0}; });
  const all = boxes.reduce((a,b) => ({x0:Math.min(a.x0,b.x0),y0:Math.min(a.y0,b.y0),x1:Math.max(a.x1,b.x1),y1:Math.max(a.y1,b.y1)}));
  const size = Math.max(all.x1-all.x0, all.y1-all.y0, 1e-3);
  let dots = boxes.filter(b => strokes.length > 1 && Math.max(b.w,b.h) < size*0.22);
  let mains = boxes.filter(b => !dots.includes(b));
  if (!mains.length){ const big = boxes.reduce((a,b)=> Math.max(b.w,b.h) > Math.max(a.w,a.h) ? b : a); mains=[big]; dots = dots.filter(d=>d!==big); }

  }
  if (!dots.length) return `Don’t forget the dots: ${c} has ${plural(spec.n)}${spec.p==='any'?'':' '+where}.`;
  const elong = d => Math.max(d.w,d.h) > 2*Math.max(Math.min(d.w,d.h), size*0.02);

    const mid = (mb.y0+mb.y1)/2;
    const bad = dots.some(d => spec.p === 'a' ? (d.y0+d.y1)/2 > mid : (d.y0+d.y1)/2 < mid);

function grade(item, slate){
  const st = slate.strokes;

  if (item.t === 'trace'){
    const T = targetMask(item.text, word), U = userMask(st, gw, GH, {sx:1,sy:1,tx:0,ty:0});
    const d = shapeDist(U, T);
    if (d.dUT <= 0.06 && d.dTU <= 0.07) return {ok:true, msg: d.D < 0.025 ? 'Clean tracing.' : 'Good tracing.'};
    return {ok:false, msg: d.dTU > 0.07 ? 'Some of the letter is missing. Cover the whole shape, dots included.' : 'Stay closer to the guide.'};
  }
  if (!word){ const dm = dotCheck(st, slate.aspect, item.text); if (dm) return {ok:false, msg:dm}; }
  const d = writeScore(st, item.text, word);
  if (d.D <= (word ? 0.09 : 0.075)){
    return {ok:true, msg: word ? `${item.w.tr}, “${item.w.en}”. Compare yours with the guide behind it.` : `That’s ${item.text}, ${LMAP[item.text].n}. Compare yours with the guide behind it.`};
  }
  return {ok:false, msg: d.dTU > d.dUT ? 'Part of the shape is missing. Compare yours with the guide now showing.' : 'The shape is off. Compare yours with the guide now showing.'};
}

/* ================= Slate (Pencil canvas) ================= */
let penSeen = false;
class Slate {
  constructor(wrap, opts){
    this.wrap = wrap; this.text = opts.text; this.word = !!opts.word; this.guide = !!opts.guide;
    this.aspect = this.word ? 2 : 1; this.strokes = []; this.active = null; this.reveal = false; this.locked = false; this.onChange = opts.onChange || (()=>{});
    const cv = this.cv = document.createElement('canvas'); cv.className = 'slate';
    cv.setAttribute('aria-label', 'Writing area'); wrap.appendChild(cv);
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    ['pointerup','pointercancel','lostpointercapture'].forEach(t => cv.addEventListener(t, e => this.up(e)));
    cv.addEventListener('touchstart', e => e.preventDefault(), {passive:false});
    cv.addEventListener('contextmenu', e => e.preventDefault());
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(wrap);
    this.resize();
  }
  resize(){
    const r = this.wrap.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    let w = r.width, h = w / this.aspect;
    if (h > r.height){ h = r.height; w = h * this.aspect; }
    w = Math.floor(Math.min(w, this.word ? 900 : 620)); h = Math.floor(w / this.aspect);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.W = w; this.H = h;
    this.cv.style.width = w + 'px'; this.cv.style.height = h + 'px';
    this.cv.width = Math.round(w*dpr); this.cv.height = Math.round(h*dpr);
    this.ctx = this.cv.getContext('2d'); this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.draw();
  }
  pt(e){
    const r = this.cv.getBoundingClientRect();
    const p = e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
    return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, p};
  }
  down(e){
    if (e.pointerType === 'pen' && !penSeen){ penSeen = true; const n = document.querySelector('.pen-note'); if (n) n.textContent = 'Pencil detected: finger and palm touches on the slate are ignored.'; }
    if (penSeen && e.pointerType === 'touch') return;
    if (this.locked || this.active !== null) return;
    e.preventDefault();
    try { this.cv.setPointerCapture(e.pointerId); } catch(_) {}
    this.active = e.pointerId; this.cur = [this.pt(e)]; this.strokes.push(this.cur);
    this.draw(); this.onChange();
  }
  move(e){
    if (e.pointerId !== this.active) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => this.cur.push(this.pt(ev)));
    this.draw();
  }
  up(e){ if (e.pointerId === this.active){ this.active = null; this.cur = null; } }
  undo(){ this.strokes.pop(); this.draw(); this.onChange(); }
  clear(){ this.strokes = []; this.draw(); this.onChange(); }
  css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  draw(){
    const {ctx, W:w, H:h} = this; if (!ctx) return;
    ctx.clearRect(0,0,w,h);
    const g = layoutGlyph(ctx, this.text, w, h, this.word);
    ctx.save(); ctx.setLineDash([8,8]); ctx.strokeStyle = this.css('--baseline'); ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(w*0.06, g.y); ctx.lineTo(w*0.94, g.y); ctx.stroke(); ctx.restore();
    if (this.guide || this.reveal || this.peek){ ctx.fillStyle = this.css('--guide'); ctx.fillText(this.text, g.x, g.y); }
    const col = this.css('--stroke'), base = h*0.024;
    ctx.strokeStyle = ctx.fillStyle = col; ctx.lineCap = ctx.lineJoin = 'round';
    this.strokes.forEach(s => {
      if (s.length === 1){ const p = s[0]; ctx.beginPath(); ctx.arc(p.x*w, p.y*h, base*(0.55+0.9*p.p)/2, 0, 7); ctx.fill(); return; }
      for (let i=1;i<s.length;i++){
        const a = s[i-1], b = s[i];
        ctx.lineWidth = base*(0.55 + 0.9*(a.p+b.p)/2);
        ctx.beginPath(); ctx.moveTo(a.x*w, a.y*h); ctx.lineTo(b.x*w, b.y*h); ctx.stroke();
      }
    });
  }
  destroy(){ this.ro.disconnect(); }
}

function breakdownV(word){

    const l = LMAP[ch];
    let s = l ? l.s : (AUX[ch] || '');
    if (vocal){ if (l && !['ا','و','ي','ة'].includes(ch)) s = cons(ch); if (ch === 'أ' || ch === 'إ') s = 'ʾ'; }
    out.push({c:ch, s});
  }
  return out;
}

  if (it.t === 'mc'){
    ok = R.sel === it.ans;
    lbody.querySelectorAll('.opt').forEach((b,k) => { b.disabled = true; b.classList.remove('sel'); if (k === it.ans) b.classList.add('right'); else if (k === R.sel) b.classList.add('wrong'); });
    title = ok ? pick(['Nice!','Correct','Exactly','Yes!']) : 'Not quite';
    msg = arWrap(it.explain);
    if (it.say && !it.listen) playAudio(it.say);
  } else {
    const g = grade(it, R.slate); ok = g.ok;
    R.slate.locked = true; R.slate.reveal = true; R.slate.draw();
    title = ok ? (it.t === 'trace' ? 'Nice tracing' : pick(['Nice writing!','Spot on','Well written'])) : 'Not quite';
    msg = arWrap(g.msg);
    if (it.t === 'write' && R.peeked && ok) msg += ' (You peeked, so try it blind next time.)';
    override = !ok && g.msg !== 'Write something first.';
  }
  R.peeked = false;
  finishCheck(ok, it);
  footer(ok ? 'ok' : 'no', {title, msg, override});
  const ob = document.getElementById('overrideBtn');
  if (ob) ob.onclick = () => {
    const qi = R.lastRetry ? R.queue.lastIndexOf(R.lastRetry) : -1;
    if (qi > R.pos) R.queue.splice(qi, 1);
    if (!it._retry) R.firstOk++;
    if (R.lastCard){ S.srs[R.lastCard.id] = R.lastCard.prev; srsGrade(R.lastCard.id, true); }
    setBar();
    footer('ok', {title:'Counted', msg:'Auto-checking handwriting is rough, so you have the final say.'});
  };
}
function finishCheck(ok, it){
  R.state = 'checked';
  R.lastRetry = null; R.lastCard = null;
  if (!it._retry){
    R.graded++; if (ok) R.firstOk++;
    if (it.card && cardKnown(it.card)){ R.lastCard = {id:it.card, prev: S.srs[it.card] ? Object.assign({}, S.srs[it.card]) : undefined}; srsGrade(it.card, ok); if (!R.lastCard.prev) delete R.lastCard.prev; }
  }
  if (!ok && !it._retry){ const c = Object.assign({}, it, {_retry:true}); R.queue.push(c); R.lastRetry = c; }
  if (R.kind !== 'lesson' && R.graded % 5 === 0) save();
}
mainBtn.addEventListener('click', () => {
  if (!R) return;
  if (R.state === 'complete') return endLesson();
  const it = R.queue[R.pos];
  if (it.t === 'story'){
    if (R.shown < it.st.lines.length){ R.shown++; return renderItem(); }
    R.pos++; return renderItem();
  }
  if (R.state === 'answer' && /^intro/.test(it.t)){ R.pos++; return renderItem(); }
  if (R.state === 'answer'){ if (!mainBtn.disabled) check(); return; }
  if (R.state === 'checked'){ R.pos++; renderItem(); }
});
document.addEventListener('keydown', e => {
  if (!R || !$('#scrim').hidden) return;
  if (e.key === 'Enter' && !mainBtn.disabled && !(e.target && e.target.tagName === 'BUTTON')){ e.preventDefault(); mainBtn.click(); }
  const it = R.queue[R.pos];
  if (it && it.t === 'mc' && R.state === 'answer' && /^[1-4]$/.test(e.key)){ const b = lbody.querySelectorAll('.opt')[+e.key-1]; b && b.click(); }
});
function complete(){
  R.state = 'complete'; $('#barFill').style.width = '100%';
  const acc = R.graded ? Math.round(R.firstOk / R.graded * 100) : 100;
  const base = {lesson:10, practice:6, review:8, story:10}[R.kind];
  const gained = base + (acc === 100 ? 5 : acc >= 80 ? 2 : 0);
  const L = R.kind === 'lesson' ? LESSONS[R.i] : null;
  if (L){ S.done[L.id] = true; lessonCards(L).forEach(srsAdd); (L.intro||[]).forEach(c => srsAdd('L:'+c)); }
  if (R.kind === 'story'){ S.stories = S.stories || {}; S.stories[R.st.id] = true; }
  S.xp += gained;
  const t = dayStr(), y = dayStr(new Date(Date.now()-864e5));
  if (S.lastDay !== t){ S.streak = S.lastDay === y ? S.streak + 1 : 1; S.lastDay = t; }
  if (S.today.day !== t) S.today = {day:t, xp:0};
  S.today.xp += gained;
  save();
  const seal = L && L.t === 'L' ? L.letters.join(' ') : R.kind === 'story' ? R.st.ar : 'برافو';
  const title = R.kind === 'story' ? 'Story finished' : R.kind === 'review' ? 'Review done' : R.kind === 'practice' ? 'Practice done' : L.t === 'R' ? 'Unit review done' : 'Lesson complete';
  const due = dueIds().length;
  lbody.innerHTML = `<div class="ex"><div class="done-screen">
    <div class="seal ar ${seal.length > 6 ? 'long' : ''}">${seal}</div>
    <h2>${title}</h2>
    <p class="sub" style="margin:0">${acc === 100 ? 'Not a single slip.' : acc >= 80 ? 'Solid work.' : 'The ones you missed came back, so they’re sticking now.'}${L && L.t !== 'R' ? ' Everything from this lesson is now in your review deck.' : ''}${R.kind === 'review' && due ? ` ${due} more ${due === 1 ? 'card is' : 'cards are'} still due.` : ''}</p>
    <div class="tiles"><div><b>+${gained}</b><span>XP</span></div><div><b>${acc}%</b><span>Accuracy</span></div><div><b>${S.streak}</b><span>Day streak</span></div></div>
  </div></div>`;
  footer('continue', {label:'Continue'});
}

/* ================= Start ================= */
LESSONS.forEach(l => { if (S.done[l.id]) { lessonCards(l).forEach(srsAdd); (l.intro||[]).forEach(c => srsAdd('L:'+c)); } });
showView(view);
startSync();
window.addEventListener('online', () => { if (authed) pullRemote(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && authed && lessonEl.hidden) pullRemote(); });

</script>
