<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ektib</title>
<meta name="description" content="Learn to read and write Egyptian Arabic with your Apple Pencil.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ektib">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf2fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1323" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one winding path of lesson stops under blue enamel street-sign unit plaques like Alexandria’s; each lesson is a full-screen card whose centrepiece is a writing slate for the Pencil. */
:root{
  --bg:#edf2fa; --surface:#ffffff; --surface-2:#f5f8fd; --ink:#14213d; --muted:#586987; --line:#d2dbea;
  --enamel:#1d4aa0; --enamel-deep:#123672; --on-enamel:#ffffff;
  --mango:#f0a20f; --mango-deep:#bf7d00; --on-mango:#2b1d00;
  --good:#1f9a4b; --good-deep:#157238; --good-tint:#e1f5e7;
  --bad:#d63a41; --bad-deep:#a3242a; --bad-tint:#fde7e7;
  --guide:#c5d3ec; --slate:#fbfcff; --stroke:#14213d; --baseline:#e2a33a;
  --locked:#dde4ef; --locked-deep:#c2ccdb; --locked-ink:#8d9bb3;
  --ui:"Baloo Bhaijaan 2","Geeza Pro",ui-rounded,system-ui,sans-serif;
  --naskh:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1323; --surface:#151f35; --surface-2:#1a2640; --ink:#e8eef9; --muted:#97a7c4; --line:#2a3a5a;
  --enamel:#3d71da; --enamel-deep:#2851a8; --on-enamel:#ffffff;
  --mango:#f4b131; --mango-deep:#c1840f; --on-mango:#2b1d00;
  --good:#3cc26a; --good-deep:#25904b; --good-tint:#12301f;
  --bad:#ff5e64; --bad-deep:#c23b41; --bad-tint:#3a191d;
  --guide:#2f4572; --slate:#10192b; --stroke:#f1f5ff; --baseline:#a57820;
  --locked:#222f4a; --locked-deep:#18223a; --locked-ink:#5f6f8f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1323; --surface:#151f35; --surface-2:#1a2640; --ink:#e8eef9; --muted:#97a7c4; --line:#2a3a5a;
  --enamel:#3d71da; --enamel-deep:#2851a8; --on-enamel:#ffffff;
  --mango:#f4b131; --mango-deep:#c1840f; --on-mango:#2b1d00;
  --good:#3cc26a; --good-deep:#25904b; --good-tint:#12301f;
  --bad:#ff5e64; --bad-deep:#c23b41; --bad-tint:#3a191d;
  --guide:#2f4572; --slate:#10192b; --stroke:#f1f5ff; --baseline:#a57820;
  --locked:#222f4a; --locked-deep:#18223a; --locked-ink:#5f6f8f;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.naskh{font-family:var(--naskh);font-weight:500}
.ar{direction:rtl;unicode-bidi:isolate}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* ---------- Home ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--naskh);font-size:30px;line-height:1;color:var(--enamel);font-weight:600}
.brand span{font-weight:800;font-size:20px;letter-spacing:.01em}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.stat svg{width:22px;height:22px}
.stat.flame{color:var(--mango-deep)}
.stat.flame.off{color:var(--locked-ink)}
.stat.xp{color:var(--enamel)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}

.home{max-width:640px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.goal h2{margin:0;font-size:17px;font-weight:700}
.goal p{margin:0;color:var(--muted);font-size:15px;grid-column:1}
.goal .meter{grid-column:1/-1;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.goal .meter span{display:block;height:100%;width:0;background:var(--mango);border-radius:99px;transition:width .5s}
.goal .num{font-weight:800;font-variant-numeric:tabular-nums;color:var(--mango-deep)}
.btn-practice{grid-row:1/3;grid-column:2}

.unit{display:flex;flex-direction:column;gap:6px}
.plaque{background:var(--enamel);color:var(--on-enamel);border-radius:10px;padding:6px;box-shadow:0 4px 0 var(--enamel-deep)}
.plaque-in{border:2px solid color-mix(in srgb,var(--on-enamel) 85%,transparent);border-radius:6px;padding:10px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center}
.plaque .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.plaque h3{margin:0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.plaque p{margin:0;font-size:14.5px;opacity:.9;grid-column:1}
.plaque .ar-title{grid-row:1/4;grid-column:2;font-family:var(--naskh);font-size:30px;line-height:1.3;font-weight:600;direction:rtl;text-align:center;max-width:12ch}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:44px 0 10px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.node{width:78px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--locked);color:var(--locked-ink);box-shadow:0 7px 0 var(--locked-deep);font-family:var(--naskh);font-size:22px;line-height:1;font-weight:600;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--locked-deep)}
.node svg{width:32px;height:32px}
.stop.done .node{background:var(--enamel);color:var(--on-enamel);box-shadow:0 7px 0 var(--enamel-deep)}
.stop.done .node:active{box-shadow:0 2px 0 var(--enamel-deep)}
.stop.current .node{background:var(--mango);color:var(--on-mango);box-shadow:0 7px 0 var(--mango-deep);width:88px;height:82px}
.stop.current .node:active{box-shadow:0 2px 0 var(--mango-deep)}
.stop.open .node{background:var(--surface);color:var(--enamel);box-shadow:0 7px 0 var(--line);border:2px solid var(--line)}
.stop-label{font-size:13.5px;color:var(--muted);font-weight:600;max-width:150px;text-align:center;line-height:1.25}
.stop.current .stop-label{color:var(--ink)}
.bubble{position:absolute;bottom:calc(100% + 6px);background:var(--surface);border:2px solid var(--line);color:var(--mango-deep);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:3px 12px;border-radius:10px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border:2px solid var(--line);border-top:0;border-left:0;transform:translate(-50%,-55%) rotate(45deg)}
.check{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.check svg{width:12px;height:12px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:14px;padding:12px 22px;min-height:52px;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--enamel);color:var(--on-enamel);box-shadow:0 5px 0 var(--enamel-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--enamel-deep)}
.btn:disabled{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-deep);cursor:default;transform:none}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-deep);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:#fff}
.btn.mango{background:var(--mango);box-shadow:0 5px 0 var(--mango-deep);color:var(--on-mango)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;min-height:44px;font-weight:700;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.link{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.9}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);-webkit-user-select:none;user-select:none}
.lhead{max-width:860px;width:100%;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;box-sizing:border-box}
.bar{flex:1;height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 12%,transparent)}
.lbody{min-height:0;overflow:auto;display:flex}
.ex{max-width:860px;width:100%;margin:0 auto;padding-block:6px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box;min-height:100%}
.kicker{margin:0;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mango-deep)}
.prompt{margin:0;font-size:clamp(22px,3.2vw,30px);font-weight:700;line-height:1.2;text-wrap:balance}
.prompt .naskh{font-size:1.25em}
.sub{margin:-6px 0 0;color:var(--muted);font-size:16px}

.slate-zone{flex:1;min-height:280px;display:flex;flex-direction:column;gap:10px}
.slate-wrap{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.slate{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--slate);border:2px solid var(--line);border-radius:22px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;box-shadow:0 4px 0 var(--line)}
.slate-tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slate-tools .ghost{display:flex;align-items:center;gap:6px}
.slate-tools svg{width:18px;height:18px}
.pen-note{font-size:13.5px;color:var(--muted);text-align:center;margin:0}

.intro{display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:center}
.tile{width:min(34vw,200px);aspect-ratio:1;max-width:100%;border-radius:24px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-family:var(--naskh);font-size:clamp(84px,14vw,128px);line-height:1;color:var(--enamel);padding-bottom:12px;box-sizing:border-box}
.facts{display:grid;gap:6px;min-width:0}
.facts .name{font-size:28px;font-weight:800;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px;background:var(--surface)}
.chip i{font-style:normal;color:var(--muted);font-weight:600;margin-right:6px}
.note{margin:0;font-size:17px;max-width:60ch;color:var(--ink)}
.forms{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;direction:rtl}
.form{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;display:grid;justify-items:center;gap:0;direction:ltr}
.form b{font-family:var(--naskh);font-size:clamp(34px,6vw,48px);line-height:1.5;color:var(--ink);font-weight:500}
.form span{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.form.na b{color:var(--locked-ink)}
.rtl-note{grid-column:1/-1;margin:-4px 0 0;font-size:13.5px;color:var(--muted)}

.word-hero{display:grid;justify-items:center;gap:4px;padding:10px 0}
.word-hero .w{font-family:var(--naskh);font-size:clamp(64px,11vw,104px);line-height:1.5;color:var(--enamel);direction:rtl}
.word-hero .tr{font-size:26px;font-weight:800}
.word-hero .en{font-size:18px;color:var(--muted)}
.breakdown{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.bd{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:2px 12px 6px;display:grid;justify-items:center;min-width:52px}
.bd b{font-family:var(--naskh);font-size:32px;line-height:1.5;font-weight:500}
.bd span{font-size:13px;color:var(--muted);font-weight:700;direction:ltr}
.bd.gap{background:none;border:0;min-width:14px}

.stage{display:grid;place-items:center;padding:6px 0 4px}
.stage .big{font-family:var(--naskh);font-size:clamp(90px,15vw,150px);line-height:1.45;color:var(--enamel);direction:rtl}
.stage .big.word{font-size:clamp(60px,10vw,96px)}
.stage .lat{font-size:clamp(46px,8vw,72px);font-weight:800;color:var(--enamel);line-height:1.2}
.stage .tag{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:68px;padding:8px 14px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700}
.opt .naskh{font-size:40px;line-height:1.3}
.opt.sel{border-color:var(--enamel);background:color-mix(in srgb,var(--enamel) 10%,var(--surface));box-shadow:0 4px 0 var(--enamel);color:var(--enamel)}
.opt.right{border-color:var(--good);background:var(--good-tint);box-shadow:0 4px 0 var(--good);color:var(--good-deep)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint);box-shadow:0 4px 0 var(--bad);color:var(--bad-deep)}
.opt:disabled{cursor:default}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.match .opt{min-height:64px}
.match .opt.done{opacity:.35;box-shadow:none;transform:none}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.lfoot.ok{background:var(--good-tint);border-color:transparent}
.lfoot.no{background:var(--bad-tint);border-color:transparent}
.lfoot-in{max-width:860px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-sizing:border-box}
.fb{flex:1;min-width:220px;display:grid;gap:2px}
.fb h4{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb h4 svg{width:26px;height:26px}
.fb p{margin:0;font-size:16px}
.lfoot.ok .fb{color:var(--good-deep)}
.lfoot.no .fb{color:var(--bad-deep)}
.fb .naskh{font-size:1.4em}
.fb .link{justify-self:start}
.lfoot .btn{min-width:170px;margin-left:auto}

.done-screen{display:grid;justify-items:center;text-align:center;gap:16px;padding-top:4vh}
.done-screen .seal{width:132px;height:132px;border-radius:50%;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;font-family:var(--naskh);font-size:46px;box-shadow:0 7px 0 var(--mango-deep);line-height:1}
.done-screen h2{margin:0;font-size:32px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:12px}
.tiles div{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 8px;display:grid}
.tiles b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.tiles span{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#060b16 45%,transparent);display:grid;align-items:end;justify-items:center}
.sheet{width:min(560px,100%);box-sizing:border-box;background:var(--surface);border-radius:22px 22px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px;border:2px solid var(--line);border-bottom:0}
.sheet h3{margin:0;font-size:22px;font-weight:800}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.toggle span{display:grid}
.toggle small{color:var(--muted);font-size:14px}
.toggle input{width:52px;height:30px;accent-color:var(--enamel)}

@media (max-width:620px){
  .intro{grid-template-columns:1fr;justify-items:center;text-align:center}
  .chips{justify-content:center}
  .forms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plaque .ar-title{font-size:24px}
  .opt .naskh{font-size:34px}
  .lfoot .btn{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 4px 10px;font-weight:700;font-size:13px;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--enamel)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--enamel)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.panel-h{margin:0;font-size:18px;font-weight:800}
.panel-title{margin:0;font-size:24px;font-weight:800;line-height:1.2;text-wrap:balance}
.muted{margin:0;color:var(--muted)}
.small{font-size:14.5px}
.due-panel{grid-template-columns:1fr auto;align-items:center;gap:16px}
.due-actions{display:grid;gap:10px}
.big-num{margin:2px 0;font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--enamel);display:flex;align-items:baseline;gap:10px}
.big-num span{font-size:18px;color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.lcell{border-radius:12px;padding:2px 4px 6px;display:grid;justify-items:center;border:2px solid var(--line);background:var(--surface-2);direction:ltr}
.lcell b{font-family:var(--naskh);font-size:28px;line-height:1.5;font-weight:500}
.lcell span{font-size:12px;font-weight:700;color:var(--muted)}
.lcell.s0{opacity:.45}
.lcell.s1{border-color:var(--mango);background:color-mix(in srgb,var(--mango) 12%,var(--surface))}
.lcell.s2{border-color:var(--enamel);background:color-mix(in srgb,var(--enamel) 12%,var(--surface))}
.lcell.s3{border-color:var(--good);background:var(--good-tint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);background:var(--surface-2)}
.legend i.s1{border-color:var(--mango)}.legend i.s2{border-color:var(--enamel)}.legend i.s3{border-color:var(--good);background:var(--good-tint)}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wstats div{border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:grid}
.wstats b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.wstats span{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.btn-review{grid-row:1/3;grid-column:2}

/* ---------- Stories ---------- */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.story-card{border:2px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:14px 14px 12px;display:grid;gap:2px;text-align:left;transition:transform .08s}
.story-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.sc-ar{font-family:var(--naskh);font-size:32px;line-height:1.5;color:var(--enamel);text-align:right}
.sc-en{font-weight:800;font-size:18px}
.sc-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.sc-meta svg{width:16px;height:16px}
.story-card.locked{opacity:.6}
.story-card.locked .sc-ar{color:var(--muted)}
.story-card.done .sc-meta{color:var(--good-deep)}
.story{display:grid;gap:14px}
.story-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.story-title{margin:0;font-family:var(--naskh);font-size:40px;line-height:1.4;color:var(--enamel);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--muted);min-height:40px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--enamel);color:var(--on-enamel)}
.lines{display:grid;gap:12px}
.line{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.line.fresh{border-color:var(--enamel);animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.line-row{display:flex;align-items:center;gap:10px}
.line-ar{flex:1;min-width:0;direction:rtl;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px}
.tok{border:0;background:none;padding:0 2px;border-radius:8px;display:inline-grid;justify-items:center;color:var(--ink)}
.tok:hover,.tok:focus-visible{background:color-mix(in srgb,var(--enamel) 12%,transparent)}
.tok-ar{font-family:var(--naskh);font-size:clamp(28px,4.4vw,36px);line-height:1.6;border-bottom:2px dotted color-mix(in srgb,var(--muted) 55%,transparent)}
.tok-tr{display:none;font-size:13px;font-weight:700;color:var(--muted);direction:ltr;line-height:1.1;padding-bottom:2px}
.show-tr .tok-tr{display:block}
.punct{font-family:var(--naskh);font-size:clamp(28px,4.4vw,36px);line-height:1.6;color:var(--muted);margin-inline-start:-8px}
.who{display:inline-flex;align-items:center;gap:2px;align-self:center;background:color-mix(in srgb,var(--mango) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--mango) 45%,var(--line));border-radius:12px;padding:0 6px;margin-inline-end:4px}
.who .tok{color:var(--mango-deep)}
.who-ar{font-family:var(--naskh);font-size:clamp(18px,2.6vw,22px);line-height:1.7;font-weight:600}
.line-en{display:none;margin:2px 0 0;color:var(--muted);font-size:16px}
.show-en .line-en{display:block}
.wsheet{display:flex;justify-content:center;align-items:center;gap:14px}
.wsheet b{font-family:var(--naskh);font-size:64px;line-height:1.5;color:var(--enamel)}

/* ---------- Audio ---------- */
.spk{border:2px solid var(--line);background:var(--surface);color:var(--enamel);width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;vertical-align:middle;box-shadow:0 3px 0 var(--line);flex:none}
.spk svg{width:22px;height:22px}
.spk.big{width:52px;height:52px}
.spk.big svg{width:28px;height:28px}
.listen-btn{width:120px;height:120px;border-radius:32px;border:0;background:var(--enamel);color:var(--on-enamel);display:grid;place-items:center;box-shadow:0 7px 0 var(--enamel-deep)}
.listen-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--enamel-deep)}
.listen-btn svg{width:56px;height:56px}
.rec-top{display:flex;align-items:center;gap:12px}
.rec-top .meter{flex:1;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.rec-top .meter span{display:block;height:100%;background:var(--good);border-radius:99px}
.rec-top b{font-variant-numeric:tabular-nums}
.rec-list{display:grid}
.rec-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rec-row:first-child{border-top:0}
.rec-row.live{background:var(--bad-tint);border-radius:12px;padding-inline:10px}
.rec-text{flex:1;min-width:0;display:grid}
.rec-text b{font-family:var(--naskh);font-size:26px;line-height:1.5;font-weight:500;text-align:right}
.rec-text span{font-size:14px;color:var(--muted)}
.rec-btns{display:flex;gap:8px;align-items:center}
.ghost.icon{width:44px;padding:0;display:grid;place-items:center;color:var(--enamel)}
.ghost.icon svg{width:22px;height:22px}
.rec-btn{border:0;border-radius:12px;min-height:44px;padding:6px 14px;display:flex;align-items:center;gap:6px;font-weight:800;background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-deep)}
.rec-btn svg{width:20px;height:20px}
.rec-btn.on{animation:pulse 1s ease-in-out infinite}
.rec-btn:disabled{opacity:.6}
@keyframes pulse{50%{box-shadow:0 4px 0 var(--bad-deep),0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}

/* ---------- Vowels + joining ---------- */
.mark-ex{font-family:var(--naskh);font-size:44px;line-height:1.6;color:var(--ink)}
.lchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;direction:rtl}
.lchips b{font-family:var(--naskh);font-size:40px;line-height:1.4;min-width:58px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 8px 4px;font-weight:500;color:var(--enamel)}
.lchips .plus{font-weight:800;color:var(--muted);font-size:20px}
.sub .lchips{justify-content:flex-start;margin:6px 0 4px}
.join-mean{color:var(--muted);font-weight:600}
.join-demo{display:grid;gap:14px}
.join-demo>div{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.join-demo .arrow{font-size:24px;color:var(--muted);font-weight:800}
.join-demo>div>b{font-family:var(--naskh);font-size:46px;line-height:1.4;color:var(--ink);font-weight:500}
.join-demo small{color:var(--muted);font-size:14.5px;font-weight:600;flex-basis:100%}
.opt.seq .naskh{letter-spacing:.02em;word-spacing:.15em}
.seal.long{font-size:30px;width:auto;min-width:132px;padding:0 24px;border-radius:66px}

.series{gap:14px}
.series-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.series-ar{font-family:var(--naskh);font-size:30px;line-height:1.35;color:var(--enamel);text-align:center;background:color-mix(in srgb,var(--enamel) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--enamel) 35%,var(--line));border-radius:16px;padding:8px 14px 12px;font-weight:600}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cast-m{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface-2);min-width:0}
.cast-m b{font-family:var(--naskh);font-size:22px;line-height:1.5;color:var(--mango-deep);font-weight:600;min-width:56px;text-align:center}
.cast-m span{font-size:14px;color:var(--muted);line-height:1.3}
.cast-m strong{color:var(--ink)}
.episodes{display:grid;gap:12px}
.ep-card{border:2px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;text-align:left;align-items:start;transition:transform .08s}
.ep-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.ep-num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:var(--mango);color:var(--on-mango);box-shadow:0 4px 0 var(--mango-deep);font-variant-numeric:tabular-nums}
.ep-card.done .ep-num{background:var(--enamel);color:var(--on-enamel);box-shadow:0 4px 0 var(--enamel-deep)}
.ep-card.locked .ep-num{background:var(--locked);color:var(--locked-ink);box-shadow:0 4px 0 var(--locked-deep)}
.ep-card.locked{opacity:.7}
.ep-body{display:grid;gap:4px;min-width:0}
.ep-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ep-title b{font-size:19px;font-weight:800}
.ep-title .ar{font-family:var(--naskh);font-size:26px;line-height:1.3;color:var(--enamel)}
.ep-teaser{color:var(--muted);font-size:15.5px;line-height:1.4}
.ep-card.done .sc-meta{color:var(--good-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,480px);box-shadow:0 8px 24px color-mix(in srgb,#000 25%,transparent)}
@media (max-width:620px){
  .due-panel{grid-template-columns:1fr}
  .story-title{font-size:32px}
  .series-head{grid-template-columns:1fr}
  .series-ar{justify-self:start;font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">

<main class="home" id="home">
  <section class="view" id="view-learn">

<nav class="tabs" id="tabs" aria-label="Sections"><div class="tabs-in">

  <button class="tab" data-v="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3.5" width="13" height="15" rx="2.5"/><path d="M4 7v11.5A2.5 2.5 0 0 0 6.5 21H15"/></svg>Review<span class="badge" id="dueBadge" hidden>0</span></button>

<script>
"use strict";
/* ================= Content ================= */
const LETTERS = [
 {c:'ا',n:'alif',s:'aa',f:'a',note:'A long “aa”, or a seat for a vowel at the start of a word. It never joins the letter after it.',join:false},
 {c:'ب',n:'baa',s:'b',f:'b',note:'Like English b. A shallow tooth with one dot below.',dots:{n:1,p:'b'}},
 {c:'ت',n:'taa',s:'t',f:'t',note:'Like English t. Same tooth as ب, with two dots above.',dots:{n:2,p:'a'}},
 {c:'ث',n:'thaa',s:'th',f:'th',note:'“th” as in think in formal Arabic. In Egyptian speech it usually becomes t or s.',dots:{n:3,p:'a'}},
 {c:'ن',n:'nuun',s:'n',f:'n',note:'Like English n. A deeper bowl than ب, with one dot above.',dots:{n:1,p:'a'}},
 {c:'ي',n:'yaa',s:'y / ee',f:'y',note:'A consonant y, or a long “ee” or “ei”. Two dots below.',dots:{n:2,p:'b'}},
 {c:'ج',n:'giim',s:'g',f:'g',note:'In Egypt this is a hard g, as in “go”. Most other Arabs say j, so Egyptians are known for it.',dots:{n:1,p:'any'}},
 {c:'ح',n:'ḥaa',s:'ḥ',f:'7',note:'A breathy h from deep in the throat, like fogging up a mirror. Franco-Arabic writes it 7.'},
 {c:'خ',n:'khaa',s:'kh',f:'5',note:'A rough kh, like the end of Scottish “loch”. Franco-Arabic writes it 5 or kh.',dots:{n:1,p:'a'}},
 {c:'د',n:'daal',s:'d',f:'d',note:'Like English d. It never joins the letter after it.',join:false},
 {c:'ذ',n:'zaal',s:'dh / z',f:'z',note:'“th” as in this in formal Arabic. Egyptians usually say d or z instead.',join:false,dots:{n:1,p:'a'}},
 {c:'ر',n:'raa',s:'r',f:'r',note:'A tapped r. It dips below the line and never joins the letter after it.',join:false},
 {c:'ز',n:'zein',s:'z',f:'z',note:'Like English z. It is ر with a dot on top.',join:false,dots:{n:1,p:'a'}},
 {c:'و',n:'waaw',s:'w / oo',f:'w',note:'A consonant w, or a long “oo” or “o”. It never joins the letter after it.',join:false},
 {c:'س',n:'siin',s:'s',f:'s',note:'Like English s. Three small teeth and a bowl.'},
 {c:'ش',n:'shiin',s:'sh',f:'sh',note:'Like English sh. The same shape as س with three dots on top.',dots:{n:3,p:'a'}},
 {c:'ص',n:'ṣaad',s:'ṣ',f:'s',note:'A heavy s: pull your tongue back and it darkens the vowels around it.'},
 {c:'ض',n:'ḍaad',s:'ḍ',f:'d',note:'A heavy d. Arabic is called “the language of ḍaad” because this sound is so rare.',dots:{n:1,p:'a'}},
 {c:'ط',n:'ṭaa',s:'ṭ',f:'6',note:'A heavy t. Franco-Arabic writes it 6.'},
 {c:'ظ',n:'ẓaa',s:'ẓ',f:"6'",note:'A heavy “th” in formal Arabic. Egyptians mostly say a heavy z.',dots:{n:1,p:'any'}},
 {c:'ع',n:'ʿein',s:'ʿ',f:'3',note:'A squeeze in the throat with no English match. Franco-Arabic writes it 3.'},
 {c:'غ',n:'ghein',s:'gh',f:"3'",note:'A gargled gh, close to a French r. Franco-Arabic writes it gh.',dots:{n:1,p:'a'}},
 {c:'ف',n:'faa',s:'f',f:'f',note:'Like English f. A small loop with one dot.',dots:{n:1,p:'a'}},
 {c:'ق',n:'ʾaaf',s:'ʾ / q',f:'2',note:'In Alexandria and Cairo this is a glottal stop, the catch in “uh-oh”. You only hear a real q in formal words like Qurʾaan.',dots:{n:2,p:'a'}},
 {c:'ك',n:'kaaf',s:'k',f:'k',note:'Like English k. The small mark inside is part of the letter, not a dot.',dots:{n:0,extra:true}},
 {c:'ل',n:'laam',s:'l',f:'l',note:'Like English l. ل followed by ا makes a special joined shape: لا (la).'},
 {c:'م',n:'miim',s:'m',f:'m',note:'Like English m. A small round loop with a tail.'},
 {c:'ه',n:'haa',s:'h',f:'h',note:'A light English h. Its shape changes a lot between the start, middle and end of a word.'},
 {c:'ة',n:'taaʾ marbuuṭa',s:'-a',f:'a',note:'Only ever at the end of a word, where it sounds like “-a”. It looks like ه with two dots.',join:false,endOnly:true,dots:{n:2,p:'a'}},
 {c:'ء',n:'hamza',s:'ʾ (catch)',f:'2',note:'A catch in the throat, like the break in “uh-oh”. It often sits on a seat: أ at the start of a word, إ under an i-sound.',join:false,aloneOnly:true,noWrite:true},
];

   Ln('لأ:laʾ:no ! الكاب:il-kaab:the_cap !', 'No! My cap!', 'يوسف:Yuusif:Yousef'),
   Ln('تحت:taḥt:below ، على:ʿala:on الصخر:iṣ-ṣakhr:the_rocks ، فيه:fi:there’s صياد:ṣayyaad:a_fisherman عجوز:ʿaguuz:old .', 'Below, on the rocks, there’s an old fisherman.'),
   Ln('الصياد:iṣ-ṣayyaad:the_fisherman يرمي:yirmi:casts السنارة:is-sinnaara:his_rod ... ويطلع:wi-yiṭallaʿ:and_pulls_out الكاب:il-kaab:the_cap !', 'The fisherman casts his rod… and pulls out the cap!'),
   Ln('ده:da:this بتاعك:bitaaʿak:yours يا:ya:(calling) ابني:ibni:son ؟', 'Is this yours, son?', 'الصياد:iṣ-ṣayyaad:the_fisherman'),
   Ln('أيوه:aywa:yes ! شكرا:shukran:thank_you يا:ya:(calling) عمو:ʿammu:sir !', 'Yes! Thank you, sir!', 'يوسف:Yuusif:Yousef'),
   Ln('العفو:il-ʿafw:you’re_welcome . أنا:ana:I’m عم:ʿamm:Uncle سعد:Saʿd:Saad . البحر:il-baḥr:the_sea بياخد:biyaakhud:takes وبيدي:wi-biyiddi:and_gives .', 'You’re welcome. I’m Amm Saad. The sea takes, and the sea gives.', 'الصياد:iṣ-ṣayyaad:the_fisherman'),
   Ln('يلا:yalla:come_on ، نشتروا:nishtiru:let’s_buy درة:dura:corn مشوية:mashwiyya:grilled وفريسكا:wi-friska:and_fresca .', 'Come on, let’s get some grilled corn and fresca.', 'نور:Nuur:Nour'),
   Ln('والكاب:wil-kaab:and_the_cap ؟ في:fi:in الشنطة:ish-shanṭa:the_bag ، لحد:liḥadd:until ما:ma:(until) الهوا:il-hawa:the_wind يهدى:yihda:dies_down .', 'And the cap? In the bag, until the wind dies down.'),
  ],
  qs:[['Where do they walk?',['Along the Corniche to Stanley Bridge','Through the fish market','To the train station'],4],['What happens to the cap?',['The wind blows it into the sea','Nour takes it','A cat steals it'],10],['Who gets the cap back?',['An old fisherman','Nour','A policeman']],['What do they buy at the end?',['Grilled corn and fresca','Ice cream','Liver sandwiches']]]},

 {id:'ep4', ar:'المشروع', en:'The microbus', note:'In Alexandria a microbus is a مشروع (mashruuʿ), literally “a project”. Fares get passed forward from hand to hand, and the change comes back the same way.', teaser:'Yousef takes his first microbus alone. The fare system is genius. His sense of direction is not.',
  ex:{ar:'ولا يهمك', tr:'wala yihimmak', en:'no worries / don’t mention it', note:'Literally “and it doesn’t concern you”. A warm, very Egyptian way to say “don’t worry about it”.'},
  lines:[
   Ln('النهارده:innaharda:today يوسف:Yuusif:Yousef رايح:raayiḥ:is_going المنتزه:il-Montaza:to_Montaza لوحده:lewaḥdu:on_his_own .', 'Today Yousef is going to Montaza on his own.'),
   Ln('اركب:irkab:take مشروع:mashruuʿ:a_microbus ، أسرع:asraʿ:it’s_faster من:min:than التاكسي:it-taksi:a_taxi .', 'Take a microbus, it’s faster than a taxi.', 'تيتة:teita:Grandma'),
   Ln('المشروع:il-mashruuʿ:the_microbus بيجري:biyigri:races على:ʿala:along الكورنيش:il-kurniish:the_Corniche ، والسواق:wis-sawwaaʾ:and_the_driver بيزعق:biyzaʿʾ:shouts .', 'The microbus races along the Corniche, and the driver shouts…'),
   Ln('منتزه:Montaza:Montaza ! منتزه:Montaza:Montaza ! طياري:ṭayyaari:quick_quick !', 'Montaza! Montaza! Quick, quick!', 'السواق:is-sawwaaʾ:the_driver'),
   Ln('يوسف:Yuusif:Yousef بيركب:biyirkab:gets_in ويقعد:wi-yuʾʿud:and_sits ورا:wara:at_the_back .', 'Yousef jumps in and sits at the back.'),
   Ln('الأجرة:il-ugra:the_fare عشرة:ʿashara:ten جني:gini:pounds . بس:bass:but السواق:is-sawwaaʾ:the_driver بعيد:biʿiid:is_far_away !', 'The fare is ten pounds. But the driver is right at the front!'),
   Ln('هات:haat:pass_me الأجرة:il-ugra:the_fare يا:ya:(calling) ابني:ibni:son .', 'Pass me the fare, son.', 'الست:is-sitt:the_woman'),
   Ln('يوسف:Yuusif:Yousef بيديها:biyiddiiha:gives_her عشرين:ʿishriin:twenty جني:gini:pounds ، والفلوس:wil-filuus:and_the_money بتمشي:bitimshi:travels من:min:from إيد:iid:hand لإيد:li-iid:to_hand .', 'Yousef hands her twenty pounds, and the money travels forward, hand to hand.'),
   Ln('وبعد:wi-baʿd:and_after شوية:shwayya:a_bit ، الباقي:il-baaʾi:the_change بيرجع:biyirgaʿ:comes_back ، من:min:from إيد:iid:hand لإيد:li-iid:to_hand .', 'A little later the change comes back, hand to hand.'),
   Ln('السيستم:is-sistim:system ده:da:this عبقري:ʿabʾari:is_genius !', 'This system is genius!', 'يوسف:Yuusif:Yousef'),
   Ln('بس:bass:but يوسف:Yuusif:Yousef بيبص:biybuṣṣ:looks من:min:out_of الشباك:ish-shibbaak:the_window ... فين:fein:where’s المنتزه:il-Montaza:Montaza ؟', 'But Yousef looks out of the window… where’s Montaza?'),
   Ln('لو:law:if سمحت:samaḥt:you_please ، المنتزه:il-Montaza:Montaza فين:fein:where ؟', 'Excuse me, where’s Montaza?', 'يوسف:Yuusif:Yousef'),
   Ln('المنتزه:il-Montaza:Montaza ؟ إحنا:iḥna:we عدينا:ʿaddeina:passed_it من:min:(since) زمان:zamaan:ages_ago ! دي:di:this_is المعمورة:il-Maʿmuura:Maamoura !', 'Montaza? We passed it ages ago! This is Maamoura!', 'السواق:is-sawwaaʾ:the_driver'),
   Ln('المشروع:il-mashruuʿ:microbus كله:kullu:the_whole بيضحك:biyiḍḥak:laughs .', 'The whole microbus bursts out laughing.'),
   Ln('ولا:wala:and_not يهمك:yihimmak:it_concerns_you ، أنا:ana:I’m راجع:raagiʿ:heading_back . خليك:khalliik:stay قاعد:ʾaaʿid:sitting .', 'No worries, I’m heading back. Stay where you are.', 'السواق:is-sawwaaʾ:the_driver'),
   Ln('يوسف:Yuusif:Yousef وصل:wiṣil:got_to المنتزه:il-Montaza:Montaza ... بعد:baʿd:after ساعة:saaʿa:an_hour .', 'Yousef made it to Montaza… an hour later.'),
  ],
  qs:[['What does the driver shout?',['Montaza! Quick, quick!','Stop here!','Tickets, please!'],4],['How does the fare reach the driver?',['Passengers pass it hand to hand','Yousef walks to the front','The driver comes round'],9],['Where does Yousef end up?',['Maamoura, past Montaza','Montaza, on time','Raml Station']],['How long does it take him to get to Montaza?',['An hour','Ten minutes','All day']]]},

 {id:'ep5', ar:'سوق السمك', en:'The fish market', note:'Ṣayyadiyya, “the fisherman’s dish”, is Alexandria’s own: fish on rice cooked brown with caramelised onions.', teaser:'Grandma wants fish for ṣayyadiyya. The seller wants a hundred pounds. Only one of them will win.',
  ex:{ar:'يا حاجة', tr:'ya ḥagga', en:'madam (to an older woman)', note:'A ḥagga is a woman who has made the pilgrimage to Mecca, but Egyptians use it for any older woman as a mark of respect. For an older man: ya ḥagg.'},
  lines:[
   Ln('يوم:yoom:on الجمعة:il-gumʿa:Friday ، تيتة:teita:Grandma عايزة:ʿayza:wants تعمل:tiʿmil:to_make صيادية:ṣayyadiyya:sayadiya .', 'On Friday, Grandma wants to make ṣayyadiyya.'),
   Ln('يلا:yalla:come_on يا:ya:(calling) يوسف:Yuusif:Yousef ، ننزلوا:ninzilu:let’s_go_down السوق:is-suuʾ:to_the_market .', 'Come on, Yousef, let’s go down to the market.', 'تيتة:teita:Grandma'),
   Ln('السوق:is-suuʾ:the_market في:fi:is_in الأنفوشي:il-Anfuushi:Anfushi ، جنب:ganb:next_to البحر:il-baḥr:the_sea .', 'The market is in Anfushi, right by the sea.'),
   Ln('ريحة:riiḥit:the_smell_of السمك:is-samak:fish في:fi:in كل:kull:every حتة:ḥitta:corner .', 'The smell of fish is everywhere.'),
   Ln('وفجأة:wi-fagʾa:and_suddenly ، يوسف:Yuusif:Yousef بيشوف:biyshuuf:sees وش:wishsh:a_face يعرفه:yiʿrafu:he_knows .', 'Suddenly Yousef sees a face he knows.'),
   Ln('ده:da:that’s عم:ʿamm:Uncle سعد:Saʿd:Saad ، الصياد:iṣ-ṣayyaad:the_fisherman !', 'That’s Amm Saad, the fisherman!', 'يوسف:Yuusif:Yousef'),
   Ln('أهلا:ahlan:hello يا:ya:(calling) بتاع:bitaaʿ:the_guy_with الكاب:il-kaab:the_cap !', 'Well hello, cap boy!', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('السمك:is-samak:fish ده:da:this بكام:bikaam:how_much ؟', 'How much is this fish?', 'تيتة:teita:Grandma'),
   Ln('الكيلو:il-kiilu:a_kilo بمية:bi-miyya:is_a_hundred جني:gini:pounds يا:ya:(calling) حاجة:ḥagga:madam .', 'A hundred pounds a kilo, madam.', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('مية:miyya:a_hundred ؟ ليه:leih:why ؟ هو:huwwa:does السمك:is-samak:fish ده:da:this بيتكلم:biyitkallim:talk ؟', 'A hundred? Why? Does this fish talk?', 'تيتة:teita:Grandma'),
   Ln('ده:da:this سمك:samak:fish طازة:ṭaaza:fresh ، لسه:lissa:just طالع:ṭaaliʿ:out من:min:of البحر:il-baḥr:the_sea !', 'This fish is fresh, just out of the sea!', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('سبعين:sabʿiin:seventy .', 'Seventy.', 'تيتة:teita:Grandma'),
   Ln('تسعين:tisʿiin:ninety .', 'Ninety.', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('تمانين:tamaniin:eighty . وده:wi-da:and_this_is حفيدي:ḥafiidi:my_grandson ، جاي:gaay:who’s_come من:min:from لندن:London:London !', 'Eighty. And this is my grandson, all the way from London!', 'تيتة:teita:Grandma'),
   Ln('خلاص:khalaaṣ:fine ، تمانين:tamaniin:eighty ، علشان:ʿalashaan:for بتاع:bitaaʿ:the_guy_with الكاب:il-kaab:the_cap .', 'Fine, eighty, for cap boy.', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('بالليل:bil-leil:in_the_evening ، الصيادية:iṣ-ṣayyadiyya:the_sayadiya على:ʿala:is_on الترابيزة:it-tarabeiza:the_table ، والرز:wir-ruzz:and_the_rice بني:bunni:brown بالبصل:bil-baṣal:with_onions .', 'That evening the ṣayyadiyya is on the table, the rice brown with onions.'),
   Ln('تيتة:teita:Grandma ، انتي:inti:you’re أشطر:ashṭar:the_smartest واحدة:waḥda:woman في:fi:in اسكندرية:Iskindiriyya:Alexandria .', 'Grandma, you’re the smartest woman in Alexandria.', 'يوسف:Yuusif:Yousef'),
  ],
  qs:[['Where is the fish market?',['In Anfushi, by the sea','In Montaza','Next to the station'],4],['Who do they bump into?',['Amm Saad, the fisherman','Nour','The microbus driver'],7],['What price do they agree on?',['80 pounds a kilo','100 pounds a kilo','70 pounds a kilo'],15],['What colour is the ṣayyadiyya rice?',['Brown','White','Yellow']]]},

 {id:'ep6', ar:'الترام', en:'The tram', note:'Qaitbay Citadel stands where the Lighthouse of Alexandria once stood, one of the Seven Wonders of the Ancient World. Earthquakes brought it down centuries ago.', teaser:'The slowest tram in Africa, the view from the window, and a wonder of the world that isn’t there any more.',
  ex:{ar:'مش طبيعي', tr:'mish ṭabiiʿi', en:'unbelievable / you’re something else', note:'Literally “not normal”. Said with a laugh to a friend being ridiculous, or about anything amazing: the food was mish ṭabiiʿi.'},
  lines:[
   Ln('يوسف:Yuusif:Yousef ونور:wi-Nuur:and_Nour في:fi:at محطة:maḥaṭṭit:the_station_of الرمل:ir-Raml:Raml .', 'Yousef and Nour are at Raml Station.'),
   Ln('الترام:it-traam:the_tram أصفر:aṣfar:is_yellow وقديم:wi-ʾadiim:and_old ، وبيعمل:wi-biyiʿmil:and_goes تن:tinn:ding تن:tinn:ding .', 'The tram is yellow and old, and it goes ding-ding.'),
   Ln('نركبوا:nirkabu:let’s_ride الترام:it-traam:the_tram لحد:liḥadd:as_far_as بحري:Baḥari:Bahari .', 'Let’s take the tram to Bahari.', 'نور:Nuur:Nour'),
   Ln('الترام:it-traam:tram ده:da:this بطيء:baṭiiʾ:slow أوي:awi:very . اللي:illi:someone ماشي:maashi:walking أسرع:asraʿ:is_faster منه:minnu:than_it !', 'This tram is so slow. Someone walking is faster!', 'يوسف:Yuusif:Yousef'),
   Ln('الترام:it-traam:the_tram مش:mish:isn’t للسرعة:lis-surʿa:for_speed . الترام:it-traam:the_tram للفرجة:lil-furga:is_for_the_view .', 'The tram isn’t for speed. The tram is for the view.', 'نور:Nuur:Nour'),
   Ln('من:min:from الشباك:ish-shibbaak:the_window ، يوسف:Yuusif:Yousef بيشوف:biyshuuf:sees عماير:ʿamaayir:buildings قديمة:ʾadiima:old وبلكونات:wi-balakoonaat:and_balconies وغسيل:wi-ghasiil:and_washing .', 'From the window Yousef sees old buildings, balconies and washing hung out to dry.'),
   Ln('وراجل:wi-raagil:and_a_man بيبيع:biybiiʿ:selling ترمس:tirmis:lupin_beans ، وعيال:wi-ʿiyaal:and_kids بيلعبوا:biyilʿabu:playing كورة:kora:football .', 'A man selling lupin beans, and kids playing football.'),
   Ln('في:fi:in بحري:Baḥari:Bahari ، هما:humma:they بيمشوا:biyimshu:walk لحد:liḥadd:up_to القلعة:il-ʾalʿa:the_citadel .', 'In Bahari they walk up to the citadel.'),
   Ln('دي:di:this_is قلعة:ʾalʿit:the_citadel_of قايتباي:Qaytbaay:Qaitbay .', 'This is Qaitbay Citadel.', 'نور:Nuur:Nour'),
   Ln('زمان:zamaan:long_ago ، هنا:hina:right_here ، كان:kaan:there_was فيه:fi:(there_was) فنار:fanaar:a_lighthouse كبير:kibiir:huge .', 'Long ago, right here, there was a huge lighthouse.', 'نور:Nuur:Nour'),
   Ln('فنار:fanaar:the_Lighthouse_of اسكندرية:Iskindiriyya:Alexandria ، واحد:waaḥid:one من:min:of عجايب:ʿagaayib:the_wonders_of الدنيا:id-dunya:the_world .', 'The Lighthouse of Alexandria, one of the wonders of the world.', 'نور:Nuur:Nour'),
   Ln('وفين:wi-fein:and_where’s هو:huwwa:it دلوقتي:dilwaʾti:now ؟', 'So where is it now?', 'يوسف:Yuusif:Yousef'),
   Ln('وقع:wiʾiʿ:it_fell من:min:(since) زمان:zamaan:ages_ago . حجارته:ḥigaartu:its_stones في:fi:are_in القلعة:il-ʾalʿa:the_citadel ، وجوه:wi-guwwa:and_under البحر:il-baḥr:the_sea .', 'It fell down ages ago. Its stones are in the citadel, and under the sea.', 'نور:Nuur:Nour'),
   Ln('يوسف:Yuusif:Yousef بيبص:biybuṣṣ:looks للبحر:lil-baḥr:at_the_sea كتير:kitiir:for_a_long_time .', 'Yousef looks out at the sea for a long time.'),
   Ln('يعني:yaʿni:so الكاب:il-kaab:my_cap بتاعي:bitaaʿi:my كان:kaan:was بيعوم:biyʿuum:swimming جنب:ganb:next_to عجيبة:ʿagiiba:a_wonder من:min:of عجايب:ʿagaayib:the_wonders_of الدنيا:id-dunya:the_world ؟', 'So my cap went swimming next to a wonder of the world?', 'يوسف:Yuusif:Yousef'),
   Ln('نور:Nuur:Nour بتضحك:bitiḍḥak:laughs . انت:inta:you مش:mish:are_not طبيعي:ṭabiiʿi:normal !', 'Nour laughs. “You’re unbelievable!”'),
  ],
  qs:[['What does Nour say the tram is for?',['The view','Speed','Carrying fish'],5],['What do they visit in Bahari?',['Qaitbay Citadel','Stanley Bridge','The Library'],9],['What stood there long ago?',['The Lighthouse of Alexandria','A royal palace','A football stadium'],13],['Why does Nour laugh?',['Yousef says his cap swam next to a wonder of the world','The tram breaks down','Yousef falls over']]]},

 {id:'ep7', ar:'الماتش', en:'The match', note:'Al Ittihad, founded in 1914, is Alexandria’s big club. In an Alexandrian café, choose your team carefully.', teaser:'Ittihad against Ahly in a packed café. Everyone asks who Yousef supports. Wrong answer.',
  ex:{ar:'خلاص', tr:'khalaaṣ', en:'that’s it / done / fine', note:'One of the most useful words in Egyptian: it ends arguments, closes deals and settles who you support.'},
  lines:[
   Ln('النهارده:innaharda:today الاتحاد:il-Ittiḥaad:Al_Ittihad قصاد:ʾuṣaad:against الأهلي:il-Ahli:Al_Ahly .', 'Today it’s Al Ittihad against Al Ahly.'),
   Ln('القهوة:il-ʾahwa:the_café مليانة:malyaana:is_full_of ناس:naas:people ، وكل:wi-kull:and_every الكراسي:il-karaasi:chair قدام:ʾuddaam:faces التلفزيون:it-tilivizyoon:the_TV .', 'The café is packed, and every chair faces the TV.'),
   Ln('نور:Nuur:Nour اتحادية:ittiḥaadiyya:supports_Ittihad ، وعم:wi-ʿamm:and_Uncle سعد:Saʿd:Saad كمان:kamaan:too .', 'Nour supports Ittihad, and so does Amm Saad.'),
   Ln('بس:bass:but صاحب:ṣaaḥib:the_owner_of القهوة:il-ʾahwa:the_café أهلاوي:ahlaawi:supports_Ahly .', 'But the café owner supports Ahly.'),
   Ln('وانت:w-inta:and_you يا:ya:(calling) يوسف:Yuusif:Yousef ؟ اتحادي:ittiḥaadi:Ittihad ولا:walla:or أهلاوي:ahlaawi:Ahly ؟', 'And you, Yousef? Ittihad or Ahly?', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
   Ln('أنا:ana:I ... بشجع:bashaggaʿ:support أرسنال:Arsinaal:Arsenal .', 'I… support Arsenal.', 'يوسف:Yuusif:Yousef'),
   Ln('القهوة:il-ʾahwa:café كلها:kullaha:the_whole بتسكت:bitiskut:goes_quiet .', 'The whole café goes quiet.'),
   Ln('النهارده:innaharda:today انت:inta:you’re اتحادي:ittiḥaadi:Ittihad . خلاص:khalaaṣ:that’s_settled .', 'Today you’re Ittihad. That’s settled.', 'نور:Nuur:Nour'),
   Ln('الماتش:il-matsh:the_match بيبدأ:biyibdaʾ:starts ، والأهلي:wil-Ahli:and_Al_Ahly بيجيب:biygiib:score جون:goon:a_goal .', 'The match starts, and Al Ahly score.'),
   Ln('صاحب:ṣaaḥib:the_owner_of القهوة:il-ʾahwa:the_café بيرقص:biyurʾuṣ:dances على:ʿala:on الترابيزة:it-tarabeiza:the_table .', 'The café owner dances on a table.'),
   Ln('الدقايق:id-daʾaayiʾ:the_minutes بتعدي:bitʿaddi:go_by . تمانين:tamaniin:eighty . خمسة:khamsa:eighty-five وتمانين:wi-tamaniin:(and_eighty) .', 'The minutes tick by. Eighty. Eighty-five.'),
   Ln('وفي:wi-fi:and_in الدقيقة:id-diʾiiʾa:minute تسعين:tisʿiin:ninety ، الاتحاد:il-Ittiḥaad:Al_Ittihad بيجيب:biygiib:score جون:goon:a_goal !', 'And in the ninetieth minute, Al Ittihad score!'),
   Ln('جووووون:goooon:GOAL !', 'GOOOAL!'),
   Ln('يوسف:Yuusif:Yousef بينط:biynuṭṭ:jumps_up ويحضن:wi-yiḥḍun:and_hugs عم:ʿamm:Uncle سعد:Saʿd:Saad .', 'Yousef leaps up and hugs Amm Saad.'),
   Ln('الماتش:il-matsh:the_match بيخلص:biyikhlaṣ:ends تعادل:taʿaadul:in_a_draw .', 'The match ends in a draw.'),
   Ln('تعادل:taʿaadul:a_draw . كله:kullu:everyone مبسوط:mabsuuṭ:is_happy ... ومحدش:wi-maḥaddish:and_nobody مبسوط:mabsuuṭ:is_happy .', 'A draw. Everyone’s happy… and nobody’s happy.', 'صاحب:ṣaaḥib:the_owner_of القهوة:il-ʾahwa:the_café'),
   Ln('انت:inta:you’re اتحادي:ittiḥaadi:Ittihad دلوقتي:dilwaʾti:now ، يا:ya:(calling) بتاع:bitaaʿ:the_guy_with الكاب:il-kaab:the_cap .', 'You’re Ittihad now, cap boy.', 'عم:ʿamm:Amm سعد:Saʿd:Saad'),
  ],
  qs:[['Who does the café owner support?',['Al Ahly','Al Ittihad','Arsenal'],4],['What happens when Yousef says “Arsenal”?',['The whole café goes quiet','Everyone cheers','The TV switches off'],8],['When does Al Ittihad score?',['In the 90th minute','In the first minute','At half time'],13],['How does the match end?',['A draw','An Ahly win','An Ittihad win']]]},

 {id:'ep8', ar:'النوة', en:'The storm', note:'Alexandria’s winter storms are called نوات (nawwaat). Alexandrians know the big ones by name and roughly when each will come.', teaser:'A winter storm, a power cut, one candle, and a story Grandma has never told before.',
  ex:{ar:'الله يرحمه', tr:'allaah yirḥamu', en:'God rest his soul', note:'Said every time you mention someone who has died. For a woman: allaah yirḥamha.'},
  lines:[
   Ln('في:fi:in الشتا:ish-shita:winter ، اسكندرية:Iskindiriyya:Alexandria فيها:fiiha:has نوات:nawwaat:storms .', 'In winter, Alexandria has its storms.'),
   Ln('النهارده:innaharda:today النوة:in-nawwa:the_storm جامدة:gamda:is_fierce ، مطر:maṭar:rain وبرق:wi-barʾ:and_lightning ورعد:wi-raʿd:and_thunder .', 'Today’s storm is fierce: rain, lightning and thunder.'),
   Ln('والموج:wil-moog:and_the_waves بيعدي:biyʿaddi:crash_over سور:suur:the_wall_of الكورنيش:il-kurniish:the_Corniche .', 'Waves are crashing over the Corniche wall.'),
   Ln('وفجأة:wi-fagʾa:and_suddenly ... النور:in-nuur:the_power قطع:ʾaṭaʿ:cuts_out !', 'And suddenly… the power cuts out!'),
   Ln('تيتة:teita:Grandma ! مش:mish:I_can’t شايف:shaayif:see حاجة:ḥaaga:anything !', 'Grandma! I can’t see a thing!', 'يوسف:Yuusif:Yousef'),
   Ln('متخافش:matkhafsh:don’t_be_scared . استنى:istanna:wait .', 'Don’t be scared. Wait.', 'تيتة:teita:Grandma'),
   Ln('تيتة:teita:Grandma بتولع:bitwallaʿ:lights شمعة:shamʿa:a_candle ، ومشمش:wi-Mishmish:and_Mishmish بتيجي:bitiigi:comes تقعد:tuʾʿud:to_sit جنبهم:ganbuhum:beside_them .', 'Grandma lights a candle, and Mishmish comes to sit beside them.'),
   Ln('كل:kull:every نوة:nawwa:storm ليها:liiha:has اسم:ism:a_name ، زي:zayy:like الناس:in-naas:people .', 'Every storm has a name, just like people.', 'تيتة:teita:Grandma'),
   Ln('لما:lamma:when كنت:kunt:I_was صغيرة:ṣughayyara:young ، جت:gat:there_came نوة:nawwa:a_storm كبيرة:kibiira:huge ، والبحر:wil-baḥr:and_the_sea دخل:dakhal:came_into الشارع:ish-shaariʿ:the_street .', 'When I was young, a huge storm came, and the sea came into the street.', 'تيتة:teita:Grandma'),
   Ln('وأنا:w-ana:and_I كنت:kunt:was واقفة:waʾfa:standing ، مش:mish:not عارفة:ʿarfa:knowing أعدي:aʿaddi:how_to_cross .', 'And there I was, standing there, not knowing how to get across.', 'تيتة:teita:Grandma'),
   Ln('وجه:wi-geh:and_along_came شاب:shaab:a_young_man طويل:ṭawiil:tall ، شالني:shaalni:picked_me_up ، وعداني:wi-ʿaddaani:and_carried_me_across .', 'Along came a tall young man, picked me up and carried me across.', 'تيتة:teita:Grandma'),
   Ln('الشاب:ish-shaab:that_young_man ده:da:(that) كان:kaan:was جدك:giddak:your_grandfather ، الله:allaah:God يرحمه:yirḥamu:rest_his_soul .', 'That young man was your grandfather, God rest his soul.', 'تيتة:teita:Grandma'),
   Ln('بجد:bi-gadd:seriously ؟', 'Seriously?', 'يوسف:Yuusif:Yousef'),
   Ln('تيتة:teita:Grandma بتضحك:bitiḍḥak:laughs . مين:miin:who يعرف:yiʿraf:knows ؟', 'Grandma laughs. “Who knows?”'),
   Ln('نعملوا:niʿmilu:let’s_make شاي:shaai:tea بلبن:bi-laban:with_milk ، ونستنوا:wi-nistannu:and_wait_for النور:in-nuur:the_power .', 'Let’s make tea with milk and wait for the power to come back.', 'تيتة:teita:Grandma'),
   Ln('بعد:baʿd:after ساعة:saaʿa:an_hour ، النور:in-nuur:the_power بيرجع:biyirgaʿ:comes_back .', 'An hour later, the power comes back.'),
   Ln('بس:bass:but يوسف:Yuusif:Yousef مكانش:makaansh:didn’t عايز:ʿaayiz:want الحكاية:il-ḥikaaya:the_story تخلص:tikhlaṣ:to_end .', 'But Yousef didn’t want the story to end.'),
  ],
  qs:[['What happens suddenly?',['The power cuts out','A window breaks','Nour arrives'],4],['What does Grandma light?',['A candle','The stove','A torch'],7],['Who carried Grandma across the flooded street?',['Yousef’s grandfather','Amm Saad','A policeman'],12],['What do they drink while they wait?',['Tea with milk','Mint tea','Coffee']]]},

 {id:'ep9', ar:'الكبدة', en:'Liver at midnight', note:'كبدة اسكندراني, Alexandrian-style liver, is chopped and fried with garlic and green chilli, and it’s famous across Egypt.', teaser:'Midnight, a street cart, and one question: spicy or normal? Yousef chooses badly.',
  ex:{ar:'اسكندراني أصلي', tr:'iskandaraani aṣli', en:'a true Alexandrian', note:'Aṣli means original or genuine. A woman is iskandaraniyya aṣliyya. Being called this by an Alexandrian is high praise.'},
  lines:[
   Ln('الساعة:is-saaʿa:it’s اتناشر:itnaashar:twelve بالليل:bil-leil:at_night ، ونور:wi-Nuur:and_Nour بتتصل:bititṣil:calls .', 'It’s midnight, and Nour calls.'),
   Ln('انت:inta:are_you جعان:gaʿaan:hungry ؟ تعالى:taʿaala:come ، ناكلوا:naaklu:let’s_eat كبدة:kibda:liver اسكندراني:iskandaraani:Alexandrian-style .', 'Hungry? Come on, let’s get Alexandrian liver.', 'نور:Nuur:Nour'),
   Ln('عربية:ʿarabiyyit:the_cart الكبدة:il-kibda:of_liver في:fi:is_on الشارع:ish-shaariʿ:the_street ، والناس:win-naas:and_people واقفين:waʾfiin:are_standing طابور:ṭabuur:in_a_queue .', 'The liver cart is out on the street, with a queue in front of it.'),
   Ln('البياع:il-bayyaaʿ:the_seller بيقطع:biyʾaṭṭaʿ:chops الكبدة:il-kibda:the_liver ، ويحط:wi-yḥuṭṭ:and_adds فلفل:filfil:chilli وتوم:wi-toom:and_garlic .', 'The seller chops the liver and throws in chilli and garlic.'),
   Ln('حراق:ḥarraaʾ:spicy ولا:walla:or عادي:ʿaadi:normal ؟', 'Spicy or normal?', 'البياع:il-bayyaaʿ:the_seller'),
   Ln('حراق:ḥarraaʾ:spicy ! أنا:ana:I’m مش:mish:not خايف:khaayif:scared .', 'Spicy! I’m not scared.', 'يوسف:Yuusif:Yousef'),
   Ln('متأكد:mitʾakkid:are_you_sure ؟', 'Are you sure?', 'نور:Nuur:Nour'),
   Ln('يوسف:Yuusif:Yousef بياكل:biyaakul:takes أول:awwil:the_first قطمة:ʾaṭma:bite .', 'Yousef takes the first bite.'),
   Ln('وشه:wishshu:his_face بيحمر:biyiḥmarr:goes_red ، وعينيه:wi-ʿiineih:and_his_eyes بتدمع:bitidmaʿ:water .', 'His face goes red, and his eyes start watering.'),
   Ln('مية:mayya:water ! مية:mayya:water !', 'Water! Water!', 'يوسف:Yuusif:Yousef'),
   Ln('البياع:il-bayyaaʿ:the_seller بيضحك:biyiḍḥak:laughs . المية:il-mayya:water مش:mish:won’t هتنفع:hatinfaʿ:help . كل:kul:eat عيش:ʿeish:bread !', 'The seller laughs. “Water won’t help. Eat bread!”'),
   Ln('شفت:shuft:see ؟ الحراق:il-ḥarraaʾ:spicy في:fi:in اسكندرية:Iskindiriyya:Alexandria حاجة:ḥaaga:is_something تانية:tanya:else .', 'See? Spicy in Alexandria is something else.', 'نور:Nuur:Nour'),
   Ln('يوسف:Yuusif:Yousef بيعيط:biyʿayyaṭ:is_crying ... بس:bass:but بيضحك:biyiḍḥak:laughing كمان:kamaan:too .', 'Yousef is crying… but laughing too.'),
   Ln('بس:bass:but حلوة:ḥilwa:it’s_good ... هات:haat:give_me واحد:waaḥid:one كمان:kamaan:more !', 'But it’s good… give me another one!', 'يوسف:Yuusif:Yousef'),
   Ln('ده:da:this_one اسكندراني:iskandaraani:Alexandrian أصلي:aṣli:through_and_through !', 'This one’s a true Alexandrian!', 'البياع:il-bayyaaʿ:the_seller'),
  ],
  qs:[['What does Nour want to eat?',['Alexandrian liver','Falafel','Fish'],2],['Spicy or normal: what does Yousef choose?',['Spicy','Normal','He can’t decide'],7],['What does the seller say will help?',['Bread','Water','Lemon'],12],['What does the seller call Yousef at the end?',['A true Alexandrian','A tourist','A Cairene']]]},

 {id:'ep10', ar:'المكتبة', en:'The library', note:'The Bibliotheca Alexandrina opened in 2002, near where the ancient Library of Alexandria stood. Its granite wall is carved with letters from scripts all over the world.', teaser:'A wall covered in the world’s alphabets, and Yousef reads his first real Arabic words.',
  ex:{ar:'برافو عليك', tr:'braavu ʿaleik', en:'well done you', note:'Egyptians borrowed bravo from Italian. Say braavu ʿaleiki to a woman.'},
  lines:[
   Ln('نور:Nuur:Nour بتاخد:bitaakhud:takes يوسف:Yuusif:Yousef مكتبة:maktabit:to_the_Library_of اسكندرية:Iskindiriyya:Alexandria .', 'Nour takes Yousef to the Library of Alexandria.'),
   Ln('المكتبة:il-maktaba:the_library زي:zayy:is_like شمس:shams:a_sun كبيرة:kibiira:huge طالعة:ṭalʿa:rising من:min:out_of الأرض:il-arḍ:the_ground .', 'The library looks like a huge sun rising out of the ground.'),
   Ln('زمان:zamaan:long_ago ، هنا:hina:here ، كان:kaan:there_was فيه:fi:(there_was) مكتبة:maktaba:a_library قديمة:ʾadiima:ancient ، فيها:fiiha:with كتب:kutub:books من:min:from كل:kull:all_over الدنيا:id-dunya:the_world .', 'Long ago, there was an ancient library here, with books from all over the world.', 'نور:Nuur:Nour'),
   Ln('على:ʿala:on الحيطة:il-ḥiiṭa:the_wall حروف:ḥuruuf:letters من:min:from لغات:lughaat:languages كتير:kitiir:many .', 'On the wall there are letters from many languages.'),
   Ln('بص:buṣṣ:look ! دي:di:these حروف:ḥuruuf:letters عربي:ʿarabi:Arabic . تقدر:tiʾdar:can_you تقراها:tiʾraaha:read_them ؟', 'Look! These are Arabic letters. Can you read them?', 'نور:Nuur:Nour'),
   Ln('يوسف:Yuusif:Yousef بيبص:biybuṣṣ:looks كويس:kwayyis:carefully . ب:b:b ... ي:ee:ee ... ت:t:t ...', 'Yousef looks carefully. B… ee… t…'),
   Ln('بيت:beit:house ! دي:di:it_says بيت:beit:house !', 'Beit! It says “house”!', 'يوسف:Yuusif:Yousef'),
   Ln('برافو:braavu:bravo عليك:ʿaleik:to_you ! وده:wi-da:and_this ؟', 'Well done you! And this one?', 'نور:Nuur:Nour'),
   Ln('ق:ʾ:ʾ ... ل:l:l ... ب:b:b ... قلب:ʾalb:heart !', 'ʾ… l… b… ʾalb, “heart”!', 'يوسف:Yuusif:Yousef'),
   Ln('انت:inta:you بتقرا:bitiʾra:can_read عربي:ʿarabi:Arabic ؟ من:min:since إمتى:imta:when ؟', 'You can read Arabic? Since when?', 'نور:Nuur:Nour'),
   Ln('من:min:for شهر:shahr:a_month . بتعلم:batʿallim:I’ve_been_learning على:ʿala:on الآيباد:il-aipad:the_iPad .', 'For a month. I’ve been learning on my iPad.', 'يوسف:Yuusif:Yousef'),
   Ln('وبتكتب:wi-bitiktib:and_can_you_write كمان:kamaan:too ؟', 'And can you write too?', 'نور:Nuur:Nour'),
   Ln('هاتي:haati:give_me ورقة:waraʾa:a_piece_of_paper .', 'Give me some paper.', 'يوسف:Yuusif:Yousef'),
   Ln('يوسف:Yuusif:Yousef بيكتب:biyiktib:writes اسمها:ismaha:her_name ، حرف:ḥarf:letter بحرف:bi-ḥarf:by_letter .', 'Yousef writes her name, letter by letter.'),
   Ln('ن:n:n ... و:uu:oo ... ر:r:r ... نور:Nuur:Nour .', 'N… oo… r… Nour.'),
   Ln('نور:Nuur:Nour مبسوطة:mabsuuṭa:is_delighted ، وبتصور:wi-bitṣawwar:and_photographs الورقة:il-waraʾa:the_paper .', 'Nour is delighted, and takes a photo of the paper.'),
   Ln('هبعتها:habʿatha:I’ll_send_it لتيتة:li-teita:to_Grandma حالا:ḥaalan:right_now !', 'I’m sending this to Grandma right now!', 'نور:Nuur:Nour'),
  ],
  qs:[['What does the library look like?',['A huge sun rising out of the ground','A ship','A pyramid'],2],['What is the first word Yousef reads?',['beit, “house”','ʾalb, “heart”','baḥr, “sea”'],7],['How has Yousef been learning?',['On his iPad','At school','From Grandma'],11],['What does Yousef write?',['Nour’s name','His own name','“Alexandria”']]]},

 {id:'ep11', ar:'الفرح', en:'The wedding', note:'An Egyptian wedding starts with the zaffa: drums, pipes and ululations as the couple make their entrance.', teaser:'Khaled is getting married. Grandma has opinions about T-shirts. Yousef cannot dance.',
  ex:{ar:'ألف مبروك', tr:'alf mabruuk', en:'congratulations', note:'Literally “a thousand congratulations”. The reply is allaah yibaarik fiik, “God bless you”.'},
  lines:[
   Ln('خالد:Khaalid:Khaled ، أخو:akhu:the_brother_of نور:Nuur:Nour ، هيتجوز:hayitgawwiz:is_getting_married بكرة:bukra:tomorrow .', 'Khaled, Nour’s brother, is getting married tomorrow.'),
   Ln('البيت:il-beit:house كله:kullu:the_whole مقلوب:maʾluub:is_upside_down .', 'The whole house is upside down.'),
   Ln('تيتة:teita:Grandma بتعمل:bitiʿmil:is_making بسبوسة:basbuusa:basbousa وغريبة:wi-ghurayyiba:and_ghorayeba ، ونور:wi-Nuur:and_Nour بتكوي:bitikwi:is_ironing الفساتين:il-fasatiin:the_dresses .', 'Grandma is making basbousa and ghorayeba, and Nour is ironing dresses.'),
   Ln('يوسف:Yuusif:Yousef ! انت:inta:you هتلبس:hatilbis:will_wear إيه:eih:what ؟', 'Yousef! What are you going to wear?', 'تيتة:teita:Grandma'),
   Ln('تيشيرت:tiishirt:a_T-shirt وجينز:wi-jiinz:and_jeans ؟', 'A T-shirt and jeans?', 'يوسف:Yuusif:Yousef'),
   Ln('تيشيرت:tiishirt:a_T-shirt ؟ في:fi:to فرح:faraḥ:a_wedding ؟ لأ:laʾ:no ، لأ:laʾ:no ، لأ:laʾ:no !', 'A T-shirt? To a wedding? No, no, no!', 'تيتة:teita:Grandma'),
   Ln('تاني:taani:the_next يوم:yoom:day ، يوسف:Yuusif:Yousef لابس:laabis:is_wearing بدلة:badlit:the_suit_of جده:giddu:his_grandfather .', 'The next day, Yousef is wearing his grandfather’s suit.'),
   Ln('البدلة:il-badla:the_suit واسعة:wasʿa:is_big شوية:shwayya:a_bit ، بس:bass:but تيتة:teita:Grandma بتعيط:bitʿayyaṭ:cries من:min:with الفرحة:il-farḥa:joy .', 'The suit is a bit big, but Grandma cries with joy.'),
   Ln('الزفة:iz-zaffa:the_zaffa بتبدأ:bitibdaʾ:begins ، طبل:ṭabl:drums ومزمار:wi-mizmaar:and_pipes وزغاريط:wi-zaghariiṭ:and_ululations .', 'The zaffa begins: drums, pipes and ululations.'),
   Ln('العروسة:il-ʿaruusa:the_bride والعريس:wil-ʿariis:and_the_groom بيدخلوا:biyidkhulu:come_in ، والناس:win-naas:and_everyone بترقص:bitturʾuṣ:dances .', 'The bride and groom make their entrance, and everyone dances.'),
   Ln('يلا:yalla:come_on يا:ya:(calling) يوسف:Yuusif:Yousef ، ارقص:urʾuṣ:dance !', 'Come on, Yousef, dance!', 'نور:Nuur:Nour'),
   Ln('أنا:ana:I مبعرفش:mabaʿrafsh:can’t أرقص:arʾuṣ:dance !', 'I can’t dance!', 'يوسف:Yuusif:Yousef'),
   Ln('وفجأة:wi-fagʾa:and_suddenly ، تيتة:teita:Grandma بتقوم:bitʾuum:gets_up وترقص:wi-turʾuṣ:and_dances !', 'Then suddenly Grandma gets up and dances!'),
   Ln('لو:law:if أنا:ana:I برقص:barʾuṣ:can_dance ، انت:inta:you تقدر:tiʾdar:can ترقص:turʾuṣ:dance !', 'If I can dance, you can dance!', 'تيتة:teita:Grandma'),
   Ln('يوسف:Yuusif:Yousef بيرقص:biyurʾuṣ:dances ... وحش:wiḥish:badly أوي:awi:really . بس:bass:but محدش:maḥaddish:nobody واخد:waakhid:is_taking باله:baalu:any_notice .', 'Yousef dances… really badly. But nobody notices.'),
   Ln('ألف:alf:a_thousand مبروك:mabruuk:congratulations !', 'Congratulations!', 'الكل:il-kull:everyone'),
  ],
  qs:[['Who is getting married?',['Khaled, Nour’s brother','Nour','Amm Saad'],3],['What does Grandma think of the T-shirt?',['No, no, no!','It’s perfect','It needs ironing'],6],['What does Yousef wear in the end?',['His grandfather’s suit','A T-shirt and jeans','Khaled’s suit'],10],['Who gets up to dance first?',['Grandma','Nour','The groom']]]},

 {id:'ep12', ar:'الوداع', en:'Goodbye', teaser:'The last evening by the sea, a bag of food too heavy to lift, and a note from Grandma.',
  ex:{ar:'متنساناش', tr:'matinsanaash', en:'don’t forget us', note:'The classic Egyptian goodbye. The answer: ʿumri ma hansaakum, “I’ll never forget you”.'},
  lines:[
   Ln('الإجازة:il-agaaza:the_holiday خلصت:khilṣit:is_over . بكرة:bukra:tomorrow يوسف:Yuusif:Yousef راجع:raagiʿ:goes_back لندن:London:to_London .', 'The holiday is over. Tomorrow Yousef goes back to London.'),
   Ln('يوسف:Yuusif:Yousef ونور:wi-Nuur:and_Nour قاعدين:ʾaʿdiin:are_sitting ع:ʿa:by البحر:il-baḥr:the_sea آخر:aakhir:one_last مرة:marra:time .', 'Yousef and Nour sit by the sea one last time.'),
   Ln('هتوحشنا:hatiwḥashna:we’ll_miss_you يا:ya:(calling) بتاع:bitaaʿ:the_guy_with الكاب:il-kaab:the_cap .', 'We’ll miss you, cap boy.', 'نور:Nuur:Nour'),
   Ln('وانتو:w-intu:and_you كمان:kamaan:too هتوحشوني:hatiwḥashuuni:I’ll_miss_you .', 'I’ll miss you all too.', 'يوسف:Yuusif:Yousef'),
   Ln('بالليل:bil-leil:that_night ، تيتة:teita:Grandma بتجهز:bitgahhiz:packs كيسة:kiisa:a_bag كبيرة:kibiira:big .', 'That night Grandma packs a big bag.'),
   Ln('في:fi:in الكيسة:il-kiisa:the_bag بسبوسة:basbuusa:basbousa ، وجبنة:wi-gibna:and_cheese ، وبلح:wi-balaḥ:and_dates ، وعلبة:wi-ʿilbit:and_a_tin_of فول:fuul:fuul .', 'In the bag: basbousa, cheese, dates and a tin of fuul.'),
   Ln('تيتة:teita:Grandma ، دي:di:is_this كيسة:kiisa:a_bag ولا:walla:or سوبر:subar:a_super ماركت:markit:market ؟', 'Grandma, is this a bag or a supermarket?', 'يوسف:Yuusif:Yousef'),
   Ln('الأكل:il-akl:the_food في:fi:in لندن:London:London مش:mish:isn’t زي:zayy:like أكلنا:aklina:our_food .', 'The food in London isn’t like ours.', 'تيتة:teita:Grandma'),
   Ln('الصبح:iṣ-ṣubḥ:in_the_morning ، في:fi:at محطة:maḥaṭṭit:the_station_of سيدي:Sidi:Sidi جابر:Gaabir:Gaber ، تيتة:teita:Grandma بتحضنه:bitiḥḍunu:hugs_him جامد:gaamid:tight .', 'In the morning, at Sidi Gaber station, Grandma hugs him tight.'),
   Ln('متنساناش:matinsanaash:don’t_forget_us يا:ya:(calling) حبيبي:ḥabiibi:my_darling .', 'Don’t forget us, my darling.', 'تيتة:teita:Grandma'),
   Ln('عمري:ʿumri:never_in_my_life ما:ma:(never) هنساكم:hansaakum:will_I_forget_you . وهكتبلك:wi-haktiblik:and_I’ll_write_to_you كل:kull:every أسبوع:usbuuʿ:week ، بالعربي:bil-ʿarabi:in_Arabic !', 'I’ll never forget you. And I’ll write to you every week, in Arabic!', 'يوسف:Yuusif:Yousef'),

function lettersIn(text){

async function pushRemote(){
  if (!authed) return;

    const r = await api('PUT', '/api/progress', S);
    if (r.status === 200) syncState = 'cloud';
    else if (r.status === 409 && r.data.progress) { syncState = 'cloud'; adopt(r.data.progress); }
    else if (r.status === 401) { authed = false; syncState = 'local'; showLogin(); }

  } catch(e) { syncState = 'offline'; }

async function pullRemote(){

    if (r.status !== 200) { syncState = 'error'; return; }
    syncState = 'cloud';
    const remote = r.data.progress;
    if (remote && (remote.updated||0) > (S.updated||0)) adopt(remote);
    else if (S.updated && (!remote || (S.updated||0) > (remote.updated||0))) pushRemote();

}

function akey(text){
  const s = plain(text).replace(/[.!؟،?,:]/g,'').replace(/\s+/g,' ').trim();
  let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0; }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

async function recStart(text){
  if (REC.mr) recStop();
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('This browser can’t record audio.');
  try { REC.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ return toast('Microphone access is blocked. Allow it for this site in Safari settings.'); }
  const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  REC.mr = new MediaRecorder(REC.stream, type ? {mimeType:type} : undefined);
  REC.chunks = []; REC.text = text;
  REC.mr.ondataavailable = ev => { if (ev.data && ev.data.size) REC.chunks.push(ev.data); };
  REC.mr.onstop = recSave;
  REC.mr.start();
  REC.timer = setTimeout(recStop, 8000);
  renderRecord();
}
function recStop(){ clearTimeout(REC.timer); if (REC.mr && REC.mr.state !== 'inactive') REC.mr.stop(); }
async function recSave(){
  const type = (REC.mr.mimeType || 'audio/mp4').split(';')[0];
  const blob = new Blob(REC.chunks, {type});
  if (REC.stream) REC.stream.getTracks().forEach(t => t.stop());
  const text = REC.text; REC.mr = null; REC.stream = null; REC.text = null;
  if (blob.size < 800){ renderRecord(); return toast('Nothing was recorded. Try again and speak after tapping.'); }
  REC.busy = text; renderRecord();
  const k = akey(text);
  try {
    const r = await fetch('/api/audio/' + k, {method:'PUT', headers:{'Content-Type':type, 'X-Text':encodeURIComponent(plain(text))}, body:blob});
    if (r.ok){ const d = await r.json(); AUD[k] = {t:plain(text), ts:d.ts || Date.now()}; playAudio(text); }
    else if (r.status === 401){ authed = false; showLogin(); }
    else toast('That recording couldn’t be saved. Try again.');
  } catch(e){ toast('You seem to be offline, so the recording wasn’t saved.'); }
  REC.busy = null; renderRecord(); renderHeader();
}
